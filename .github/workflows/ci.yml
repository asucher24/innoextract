name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

jobs:
  debian-package:
    name: Debian 10 Debug package
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive
      DEBUG: on
      DEBUG_EXTRA: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show source revision
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Source revision"
          echo "========================================"

          git rev-parse HEAD
          git status --short

      - name: Prepare output directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/ci-output"
          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          echo "========================================"
          echo "Output directory"
          echo "========================================"

          ls -la "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Debian package in Debian 10
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create Debian 10 container"
          echo "========================================"

          IMAGE="debian:10"
          CONTAINER="innoextract-build-${GITHUB_RUN_ID}"

          docker pull "${IMAGE}"

          docker run \
            --name "${CONTAINER}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEBUG=on \
            -e DEBUG_EXTRA=on \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${GITHUB_WORKSPACE}/ci-output:/output" \
            "${IMAGE}" \
            bash -s <<'CONTAINER_SCRIPT'
          set -euxo pipefail

          echo "========================================"
          echo "Debian version"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Configure Debian repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'APT_SOURCES'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          APT_SOURCES

          cat > /etc/apt/apt.conf.d/99archive <<'APT_CONFIG'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          APT_CONFIG

          apt-get update

          echo
          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            ca-certificates \
            build-essential \
            cmake \
            git \
            pkg-config \
            python3 \
            python3-pip \
            dpkg-dev \
            debhelper \
            fakeroot \
            file \
            patchelf \
            curl \
            wget \
            xz-utils \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev \
            tar

          echo
          echo "========================================"
          echo "Environment"
          echo "========================================"

          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Compiler:"
          g++ --version

          echo
          echo "========================================"
          echo "Build Boost 1.83"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_VERSION_UNDERSCORE="1_83_0"
          BOOST_ARCHIVE="/tmp/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz"
          BOOST_PREFIX="/opt/boost"

          mkdir -p /tmp/boost
          cd /tmp/boost

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o "${BOOST_ARCHIVE}" \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz"

          tar -xzf "${BOOST_ARCHIVE}"

          cd "boost_${BOOST_VERSION_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix="${BOOST_PREFIX}" \
            --with-libraries=filesystem,iostreams,program_options,date_time

          ./b2 \
            -j"$(nproc)" \
            variant=release \
            link=shared \
            runtime-link=shared \
            threading=multi \
            install

          echo
          echo "Boost installation:"
          find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost*' -print | sort

          echo
          echo "========================================"
          echo "Copy source"
          echo "========================================"

          rm -rf /src-build
          mkdir -p /src-build

          cp -a /src/. /src-build/

          cd /src-build

          echo
          echo "========================================"
          echo "Configure innoextract"
          echo "========================================"

          rm -rf build
          mkdir build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONTINUOUS_INTEGRATION=1 \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBOOST_ROOT="${BOOST_PREFIX}" \
            -DBoost_ROOT="${BOOST_PREFIX}" \
            -DBoost_INCLUDE_DIR="${BOOST_PREFIX}/include" \
            -DBoost_LIBRARY_DIR="${BOOST_PREFIX}/lib"

          echo
          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake --build . --parallel "$(nproc)"

          echo
          echo "========================================"
          echo "Run tests"
          echo "========================================"

          if cmake --build . --target check; then
            echo "Tests passed."
          else
            echo "No check target or tests failed."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Debug binary"
          echo "========================================"

          find . -maxdepth 2 -type f -name innoextract -exec ls -lh {} \;

          ./innoextract --help || true

          echo
          echo "========================================"
          echo "Create Debian package"
          echo "========================================"

          cd /src-build

          PACKAGE_ROOT="/tmp/innoextract-package"
          INSTALL_ROOT="${PACKAGE_ROOT}/usr"
          LIB_ROOT="${INSTALL_ROOT}/lib/innoextract"

          rm -rf "${PACKAGE_ROOT}"
          mkdir -p \
            "${INSTALL_ROOT}/bin" \
            "${LIB_ROOT}" \
            "${PACKAGE_ROOT}/DEBIAN"

          cp build/innoextract "${INSTALL_ROOT}/bin/innoextract"

          echo
          echo "========================================"
          echo "Collect runtime libraries"
          echo "========================================"

          copy_lib() {
            local lib="$1"

            if [ -f "${lib}" ]; then
              cp -L "${lib}" "${LIB_ROOT}/"
            else
              echo "ERROR: Library not found: ${lib}"
              exit 1
            fi
          }

          copy_lib "${BOOST_PREFIX}/lib/libboost_iostreams.so.1.83.0"
          copy_lib "${BOOST_PREFIX}/lib/libboost_filesystem.so.1.83.0"
          copy_lib "${BOOST_PREFIX}/lib/libboost_program_options.so.1.83.0"

          # liblzma is deliberately copied as well so the package uses
          # the version it was built/tested with.
          copy_lib "$(ldconfig -p | awk '/liblzma.so.5 / {print $NF; exit}')"

          # libstdc++ and libgcc are copied because the goal is a portable
          # application package. libc itself is intentionally NOT copied.
          copy_lib "$(g++ -print-file-name=libstdc++.so.6)"
          copy_lib "$(gcc -print-file-name=libgcc_s.so.1)"

          echo
          echo "Bundled libraries:"
          ls -lh "${LIB_ROOT}"

          echo
          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          patchelf \
            --set-rpath '$ORIGIN/../lib/innoextract' \
            "${INSTALL_ROOT}/bin/innoextract"

          echo
          echo "Binary:"
          file "${INSTALL_ROOT}/bin/innoextract"

          echo
          echo "RPATH:"
          patchelf --print-rpath "${INSTALL_ROOT}/bin/innoextract"

          echo
          echo "========================================"
          echo "Create control file"
          echo "========================================"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<CONTROL
          Package: innoextract
          Version: 0.0.0+git${GITHUB_RUN_NUMBER:-0}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: innoextract
          Description: Extract files from Inno Setup installers
           Debug build of innoextract with bundled Boost runtime libraries.
          CONTROL

          echo
          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          PACKAGE_NAME="innoextract_0.0.0+git${GITHUB_RUN_NUMBER:-0}_amd64.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PACKAGE_ROOT}" \
            "/output/${PACKAGE_NAME}"

          echo
          echo "========================================"
          echo "Created package"
          echo "========================================"

          ls -lh "/output/${PACKAGE_NAME}"

          echo
          echo "========================================"
          echo "Inspect package"
          echo "========================================"

          dpkg-deb -I "/output/${PACKAGE_NAME}"

          echo
          echo "Package contents:"
          dpkg-deb -c "/output/${PACKAGE_NAME}"

          echo
          echo "========================================"
          echo "Test package installation"
          echo "========================================"

          # Do NOT install the package with apt here.
          #
          # The package intentionally contains private copies of runtime
          # libraries. Installing it with apt in this build container can
          # make apt attempt to resolve/reconcile dependencies against the
          # old Debian 10 package database.
          #
          # Instead unpack the package into a clean filesystem and execute
          # the actual binary from there.

          TEST_ROOT="/tmp/innoextract-test"

          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}"

          dpkg-deb \
            --extract \
            "/output/${PACKAGE_NAME}" \
            "${TEST_ROOT}"

          echo
          echo "Bundled runtime libraries:"
          find "${TEST_ROOT}/usr/lib/innoextract" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "========================================"
          echo "Check runtime dependencies"
          echo "========================================"

          ldd "${TEST_ROOT}/usr/bin/innoextract"

          echo
          echo "========================================"
          echo "Test binary"
          echo "========================================"

          "${TEST_ROOT}/usr/bin/innoextract" --help >/dev/null

          echo "innoextract executable successfully."

          echo
          echo "========================================"
          echo "Final package"
          echo "========================================"

          ls -lh /output/*.deb

          echo "Package successfully created."
          CONTAINER_SCRIPT

          echo
          echo "========================================"
          echo "Remove build container"
          echo "========================================"

          docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true

          echo
          echo "========================================"
          echo "CI output"
          echo "========================================"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Verify Debian package exists
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one .deb package."
            echo "Found: ${#PACKAGES[@]}"
            printf '%s\n' "${PACKAGES[@]:-<none>}"
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo "Package:"
          echo "${PACKAGE}"

          echo
          echo "Size:"
          ls -lh "${PACKAGE}"

          echo
          echo "Package metadata:"
          dpkg-deb -I "${PACKAGE}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-debug
          path: ci-output/*.deb
          if-no-files-found: error
          retention-days: 30
