name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "21 11 * * 5"

env:
  DEBUG: on
  DEBUG_EXTRA: on
  CMAKE_BUILD_TYPE: Debug

jobs:
  build-debian10:
    name: Build Debian package on Debian 10
    runs-on: ubuntu-latest
    container:
      image: debian:10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Debian 10 APT archive
        shell: bash
        run: |
          set -euo pipefail
          printf "%s\n" \
            "deb http://archive.debian.org/debian buster main" \
            "deb http://archive.debian.org/debian-security buster/updates main" \
            > /etc/apt/sources.list
          printf "%s\n" 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            dpkg-dev \
            file \
            libboost-all-dev \
            liblzma-dev \
            patchelf \
            pax-utils

      - name: Show toolchain versions
        run: |
          cmake --version
          gcc --version
          g++ --version
          dpkg --print-architecture

      - name: Configure
        run: |
          cmake \
            -B "${{ github.workspace }}/build" \
            -Werror=dev \
            -Werror=deprecated \
            -DCONTINUOUS_INTEGRATION=1

      - name: Build
        run: |
          cmake \
            --build "${{ github.workspace }}/build" \
            --parallel

      - name: Check style
        run: |
          cmake \
            --build "${{ github.workspace }}/build" \
            --target style

      - name: Show binary dependencies
        run: |
          echo "Binary:"
          file build/innoextract

          echo
          echo "Dependencies:"
          ldd build/innoextract

      - name: Prepare Debian package
        shell: bash
        run: |
          set -euo pipefail

          PKGROOT="${PWD}/package"
          LIBDIR="${PKGROOT}/usr/lib/innoextract"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
          ARCH="$(dpkg --print-architecture)"

          rm -rf "$PKGROOT"
          mkdir -p "${PKGROOT}/DEBIAN" "${PKGROOT}/usr/bin" "$LIBDIR"

          cp build/innoextract "${PKGROOT}/usr/bin/innoextract"
          chmod 0755 "${PKGROOT}/usr/bin/innoextract"

          echo "========================================"
          echo "Original binary dependencies"
          echo "========================================"
          ldd build/innoextract

          echo
          echo "========================================"
          echo "Collecting recursive dependencies"
          echo "========================================"
          lddtree -l build/innoextract > /tmp/all-libraries.txt
          cat /tmp/all-libraries.txt

          echo
          echo "========================================"
          echo "Bundling libraries"
          echo "========================================"
          while read -r LIB; do
            [ "${LIB#/}" != "$LIB" ] || continue
            BASENAME="$(basename "$LIB")"
            case "$BASENAME" in
              ld-linux*.so*|libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*)
                echo "System library: $LIB"
                continue
                ;;
            esac
            echo "Bundling: $LIB"
            cp -L "$LIB" "$LIBDIR/$BASENAME"
          done < /tmp/all-libraries.txt

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"
          ls -lah "$LIBDIR"

          echo
          echo "========================================"
          echo "Setting RPATH"
          echo "========================================"
          patchelf --set-rpath /usr/lib/innoextract "${PKGROOT}/usr/bin/innoextract"
          patchelf --print-rpath "${PKGROOT}/usr/bin/innoextract"

          printf "%s\n" \
            "Package: innoextract" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: ${ARCH}" \
            "Maintainer: innoextract CI" \
            "Description: Tool for extracting Inno Setup installers" \
            " innoextract extracts files from installers created by Inno Setup." \
            > "${PKGROOT}/DEBIAN/control"

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PKGROOT}" \
            "innoextract_${VERSION}_${ARCH}.deb"

      - name: Inspect Debian package
        run: |
          echo "========================================"
          echo "Package information"
          echo "========================================"
          dpkg-deb --info innoextract_*.deb

          echo
          echo "========================================"
          echo "Package contents"
          echo "========================================"
          dpkg-deb --contents innoextract_*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian-amd64
          path: innoextract_*.deb
          if-no-files-found: error

  test-debian10:
    name: Test package on Debian 10
    runs-on: ubuntu-latest
    needs: build-debian10
    container:
      image: debian:10

    steps:
      - name: Configure Debian 10 APT archive
        shell: bash
        run: |
          set -euo pipefail
          printf "%s\n" \
            "deb http://archive.debian.org/debian buster main" \
            "deb http://archive.debian.org/debian-security buster/updates main" \
            > /etc/apt/sources.list
          printf "%s\n" 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: innoextract-debian-amd64

      - name: Install and test package
        shell: bash
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./innoextract_*.deb
          command -v innoextract
          ls -l /usr/bin/innoextract
          ldd /usr/bin/innoextract
          if ldd /usr/bin/innoextract | grep -q "not found"; then
            echo "ERROR: Missing runtime libraries!"
            ldd /usr/bin/innoextract
            exit 1
          fi
          innoextract --debug --help

  test-ubuntu24:
    name: Test package on Ubuntu 24.04
    runs-on: ubuntu-latest
    needs: build-debian10
    container:
      image: ubuntu:24.04

    steps:
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: innoextract-debian-amd64

      - name: Install and test package
        shell: bash
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./innoextract_*.deb
          command -v innoextract
          ls -l /usr/bin/innoextract
          ldd /usr/bin/innoextract
          if ldd /usr/bin/innoextract | grep -q "not found"; then
            echo "ERROR: Missing runtime libraries!"
            ldd /usr/bin/innoextract
            exit 1
          fi
          innoextract --debug --help
