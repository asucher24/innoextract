name: CI

on:
  push:
    branches:
      - master
      - build-deb
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

jobs:
  debian10:
    name: Debian 10 Debug build
    runs-on: ubuntu-latest

    container:
      image: debian:10

    env:
      DEBIAN_FRONTEND: noninteractive
      DEBUG: "on"
      DEBUG_EXTRA: "on"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Environment"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          echo
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

      - name: Configure Debian 10 repositories
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF

          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          EOF

          apt-get update

      - name: Install build dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            ca-certificates \
            xz-utils \
            pkg-config \
            file \
            patchelf \
            dpkg-dev \
            fakeroot \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev

      - name: Prepare output directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Prepare output directory"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/ci-output"
          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          ls -la "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Boost 1.83
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Boost 1.83"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_UNDERSCORE="1_83_0"
          BOOST_PREFIX="/opt/boost"

          cd /tmp

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o "boost_${BOOST_UNDERSCORE}.tar.gz" \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"

          tar -xzf "boost_${BOOST_UNDERSCORE}.tar.gz"

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix="${BOOST_PREFIX}" \
            --with-libraries=system,filesystem,iostreams,program_options,date_time

          ./b2 \
            -j"$(nproc)" \
            variant=release \
            link=shared \
            threading=multi \
            install

          echo
          echo "========================================"
          echo "Installed Boost libraries"
          echo "========================================"

          find "${BOOST_PREFIX}/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -printf '%f\n' \
            | sort

          echo
          echo "========================================"
          echo "Verify required Boost libraries"
          echo "========================================"

          test -f "${BOOST_PREFIX}/lib/libboost_system.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_filesystem.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_iostreams.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_program_options.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_date_time.so.1.83.0"

          echo "All required Boost libraries exist."

      - name: Configure CMake
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure CMake"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/build"

          cmake \
            -S "${GITHUB_WORKSPACE}" \
            -B "${GITHUB_WORKSPACE}/build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONTINUOUS_INTEGRATION=1 \
            -DBOOST_ROOT=/opt/boost \
            -DBOOST_LIBRARYDIR=/opt/boost/lib \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --parallel "$(nproc)"

      - name: Run tests
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Run tests"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --target check

      - name: Verify debug build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify debug build"
          echo "========================================"

          BINARY="${GITHUB_WORKSPACE}/build/innoextract"

          test -x "${BINARY}"

          echo "Binary:"
          file "${BINARY}"

          echo
          echo "RPATH before packaging:"
          patchelf --print-rpath "${BINARY}" || true

          echo
          echo "Runtime dependencies:"
          ldd "${BINARY}"

      - name: Create Debian package directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create Debian package directory"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          INSTALL_ROOT="${PACKAGE_ROOT}/usr"
          LIB_ROOT="${INSTALL_ROOT}/lib/innoextract"

          rm -rf "${PACKAGE_ROOT}"

          mkdir -p \
            "${INSTALL_ROOT}/bin" \
            "${LIB_ROOT}" \
            "${PACKAGE_ROOT}/DEBIAN"

          cp \
            "${GITHUB_WORKSPACE}/build/innoextract" \
            "${INSTALL_ROOT}/bin/innoextract"

          chmod 0755 \
            "${INSTALL_ROOT}/bin/innoextract"

      - name: Bundle Boost libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle ALL Boost shared libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"
          BOOST_LIB_ROOT="/opt/boost/lib"

          BOOST_COUNT=0

          for library in "${BOOST_LIB_ROOT}"/libboost_*.so*; do
            if [ -f "${library}" ]; then
              echo "Bundling Boost library:"
              echo "  ${library}"

              cp -L "${library}" "${LIB_ROOT}/"

              BOOST_COUNT=$((BOOST_COUNT + 1))
            fi
          done

          if [ "${BOOST_COUNT}" -eq 0 ]; then
            echo "ERROR: No Boost shared libraries found."
            exit 1
          fi

          echo
          echo "Bundled ${BOOST_COUNT} Boost shared libraries."

          echo
          echo "Boost libraries in package:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -printf '%f\n' \
            | sort

      - name: Bundle non-system runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle non-system runtime libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          copy_library() {
            local library="$1"

            if [ ! -f "${library}" ]; then
              echo
              echo "ERROR: Runtime library does not exist:"
              echo "  ${library}"
              exit 1
            fi

            echo "Bundling:"
            echo "  ${library}"

            cp -L "${library}" "${LIB_ROOT}/"
          }

          LZMA_LIBRARY="$(
            ldconfig -p |
              awk '/liblzma.so.5 / {print $NF; exit}'
          )"

          ZSTD_LIBRARY="$(
            ldconfig -p |
              awk '/libzstd.so.1 / {print $NF; exit}'
          )"

          BZ2_LIBRARY="$(
            ldconfig -p |
              awk '/libbz2.so.1.0 / {print $NF; exit}'
          )"

          Z_LIBRARY="$(
            ldconfig -p |
              awk '/libz.so.1 / {print $NF; exit}'
          )"

          if [ -z "${LZMA_LIBRARY}" ]; then
            echo "ERROR: Could not find liblzma.so.5"
            exit 1
          fi

          if [ -z "${ZSTD_LIBRARY}" ]; then
            echo "ERROR: Could not find libzstd.so.1"
            exit 1
          fi

          if [ -z "${BZ2_LIBRARY}" ]; then
            echo "ERROR: Could not find libbz2.so.1.0"
            exit 1
          fi

          if [ -z "${Z_LIBRARY}" ]; then
            echo "ERROR: Could not find libz.so.1"
            exit 1
          fi

          copy_library "${LZMA_LIBRARY}"
          copy_library "${ZSTD_LIBRARY}"
          copy_library "${BZ2_LIBRARY}"
          copy_library "${Z_LIBRARY}"

          echo
          echo "Non-system runtime libraries bundled."

      - name: Bundle compiler runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle compiler runtime libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          copy_library() {
            local library="$1"

            if [ ! -f "${library}" ]; then
              echo
              echo "ERROR: Runtime library does not exist:"
              echo "  ${library}"
              exit 1
            fi

            echo "Bundling:"
            echo "  ${library}"

            cp -L "${library}" "${LIB_ROOT}/"
          }

          LIBSTDCPP="$(
            g++ -print-file-name=libstdc++.so.6
          )"

          LIBGCC="$(
            gcc -print-file-name=libgcc_s.so.1
          )"

          copy_library "${LIBSTDCPP}"
          copy_library "${LIBGCC}"

          echo
          echo "Compiler runtime libraries bundled."

      - name: Set RPATH
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          patchelf \
            --set-rpath '$ORIGIN/../lib/innoextract' \
            "${BINARY}"

          echo
          echo "RPATH:"
          patchelf --print-rpath "${BINARY}"

      - name: Inspect bundled libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Inspect bundled libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          echo
          echo "Bundled libraries:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking bundled libraries with ldd:"
          echo

          for library in "${LIB_ROOT}"/*.so*; do
            if [ -f "${library}" ]; then
              echo "----------------------------------------"
              echo "${library}"
              echo "----------------------------------------"

              ldd "${library}" || true
            fi
          done

      - name: Create package metadata
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create package metadata"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: innoextract
          Description: Extract files from Inno Setup installers
           Debug build of innoextract with bundled runtime dependencies.
          EOF

          echo "Package version: ${VERSION}"

      - name: Build Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          PACKAGE="${GITHUB_WORKSPACE}/ci-output/innoextract_${VERSION}_amd64.deb"

          rm -f "${GITHUB_WORKSPACE}/ci-output/"*.deb

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PACKAGE_ROOT}" \
            "${PACKAGE}"

          test -f "${PACKAGE}"

          echo
          echo "Created package:"
          ls -lh "${PACKAGE}"

      - name: Inspect Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Inspect Debian package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo
          echo "Package:"
          echo "${PACKAGE}"

          echo
          echo "Package metadata:"
          dpkg-deb -I "${PACKAGE}"

          echo
          echo "Package contents:"
          dpkg-deb -c "${PACKAGE}"

      - name: Test package without external dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Test package without external dependencies"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Debian package."
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"
          TEST_ROOT="/tmp/innoextract-test"

          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}"

          dpkg-deb \
            --extract \
            "${PACKAGE}" \
            "${TEST_ROOT}"

          BINARY="${TEST_ROOT}/usr/bin/innoextract"
          LIB_ROOT="${TEST_ROOT}/usr/lib/innoextract"

          test -x "${BINARY}"

          echo
          echo "========================================"
          echo "Package RPATH"
          echo "========================================"

          patchelf --print-rpath "${BINARY}"

          EXPECTED_RPATH='$ORIGIN/../lib/innoextract'
          ACTUAL_RPATH="$(patchelf --print-rpath "${BINARY}")"

          if [ "${ACTUAL_RPATH}" != "${EXPECTED_RPATH}" ]; then
            echo
            echo "ERROR: Unexpected RPATH."
            echo "Expected: ${EXPECTED_RPATH}"
            echo "Actual:   ${ACTUAL_RPATH}"
            exit 1
          fi

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          ldd "${BINARY}"

          if ldd "${BINARY}" | grep -q "not found"; then
            echo
            echo "ERROR: Binary has missing runtime libraries."
            exit 1
          fi

          echo
          echo "Direct binary dependencies are resolved."

          echo
          echo "========================================"
          echo "Check bundled libraries recursively"
          echo "========================================"

          MISSING=0

          check_dependencies() {
            local object="$1"

            echo
            echo "Checking:"
            echo "  ${object}"

            while IFS= read -r line; do
              if echo "${line}" | grep -q "not found"; then
                echo
                echo "ERROR: Missing dependency:"
                echo "  ${line}"
                MISSING=1
              fi
            done < <(ldd "${object}" || true)
          }

          check_dependencies "${BINARY}"

          for library in "${LIB_ROOT}"/*.so*; do
            if [ -f "${library}" ]; then
              check_dependencies "${library}"
            fi
          done

          if [ "${MISSING}" -ne 0 ]; then
            echo
            echo "ERROR: One or more bundled libraries have unresolved dependencies."
            exit 1
          fi

          echo
          echo "All bundled libraries have their dependencies resolved."

          echo
          echo "========================================"
          echo "Verify critical bundled libraries"
          echo "========================================"

          test -f "${LIB_ROOT}/libboost_system.so.1.83.0"
          test -f "${LIB_ROOT}/libboost_filesystem.so.1.83.0"
          test -f "${LIB_ROOT}/libboost_iostreams.so.1.83.0"
          test -f "${LIB_ROOT}/libboost_program_options.so.1.83.0"
          test -f "${LIB_ROOT}/libboost_date_time.so.1.83.0"
          test -f "${LIB_ROOT}/libboost_atomic.so.1.83.0"
          test -f "${LIB_ROOT}/liblzma.so.5"
          test -f "${LIB_ROOT}/libzstd.so.1"
          test -f "${LIB_ROOT}/libbz2.so.1.0"
          test -f "${LIB_ROOT}/libz.so.1"
          test -f "${LIB_ROOT}/libstdc++.so.6"
          test -f "${LIB_ROOT}/libgcc_s.so.1"

          echo "All critical runtime libraries are included."

          echo
          echo "========================================"
          echo "Execute packaged binary"
          echo "========================================"

          "${BINARY}" --help >/dev/null

          echo
          echo "Packaged binary works without installing external runtime dependencies."

      - name: Final artifact check
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final artifact check"
          echo "========================================"

          echo
          echo "Output directory:"
          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Files:"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          echo
          echo "Exactly one Debian package found:"
          echo "${PACKAGES[0]}"

          echo
          echo "Package size:"
          du -h "${PACKAGES[0]}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          retention-days: 30
