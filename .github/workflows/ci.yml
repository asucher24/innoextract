name: CI

on:
  push:
    branches:
      - master
      - build-deb
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

jobs:
  debian10:
    name: Debian 10 Debug build
    runs-on: ubuntu-latest

    container:
      image: debian:10

    env:
      DEBIAN_FRONTEND: noninteractive
      BOOST_VERSION: "1.83.0"
      BOOST_UNDERSCORE: "1_83_0"
      BOOST_PREFIX: "/opt/boost"
      PACKAGE_ROOT: "/tmp/innoextract-package"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Environment"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "Architecture:"
          dpkg --print-architecture

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "GITHUB_WORKSPACE:"
          echo "${GITHUB_WORKSPACE}"

          echo
          echo "Build tools will be installed in the next step."

      - name: Configure Debian 10 repositories
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          rm -f /etc/apt/sources.list.d/*.list

          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF

          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          EOF

          apt-get update

      - name: Install build dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            ca-certificates \
            xz-utils \
            pkg-config \
            file \
            patchelf \
            dpkg-dev \
            fakeroot \
            binutils \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev

      - name: Verify build toolchain
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify build toolchain"
          echo "========================================"

          echo
          echo "GCC:"
          gcc --version

          echo
          echo "G++:"
          g++ --version

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Make:"
          make --version | head -n 1

          echo
          echo "Pkg-config:"
          pkg-config --version

          echo
          echo "Architecture:"
          dpkg --print-architecture

          echo
          echo "glibc:"
          ldd --version | head -n 1

      - name: Prepare output directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Prepare output directory"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/ci-output"
          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          ls -lah "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Boost 1.83
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Boost ${BOOST_VERSION}"
          echo "========================================"

          cd /tmp

          rm -rf \
            "boost_${BOOST_UNDERSCORE}" \
            "boost_${BOOST_UNDERSCORE}.tar.gz" \
            "${BOOST_PREFIX}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o "boost_${BOOST_UNDERSCORE}.tar.gz" \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"

          tar \
            -xzf \
            "boost_${BOOST_UNDERSCORE}.tar.gz"

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix="${BOOST_PREFIX}" \
            --with-libraries=system,filesystem,iostreams,program_options,date_time

          ./b2 \
            -j"$(nproc)" \
            variant=release \
            link=shared \
            threading=multi \
            install

          echo
          echo "========================================"
          echo "Boost libraries"
          echo "========================================"

          find "${BOOST_PREFIX}/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Verify Boost installation"
          echo "========================================"

          test -f "${BOOST_PREFIX}/lib/libboost_system.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_filesystem.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_iostreams.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_program_options.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_date_time.so.1.83.0"

          echo "Boost installation verified."

      - name: Configure CMake
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure CMake"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/build"

          cmake \
            -S "${GITHUB_WORKSPACE}" \
            -B "${GITHUB_WORKSPACE}/build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONTINUOUS_INTEGRATION=1 \
            -DBOOST_ROOT="${BOOST_PREFIX}" \
            -DBOOST_LIBRARYDIR="${BOOST_PREFIX}/lib" \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Verify CMake configuration
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify CMake configuration"
          echo "========================================"

          grep '^CMAKE_BUILD_TYPE:STRING=' \
            "${GITHUB_WORKSPACE}/build/CMakeCache.txt"

          test \
            "$(grep '^CMAKE_BUILD_TYPE:STRING=' "${GITHUB_WORKSPACE}/build/CMakeCache.txt")" \
            = "CMAKE_BUILD_TYPE:STRING=Debug"

          echo
          echo "Boost root:"
          grep '^BOOST_ROOT:' \
            "${GITHUB_WORKSPACE}/build/CMakeCache.txt" || true

          echo
          echo "Boost library directory:"
          grep '^BOOST_LIBRARYDIR:' \
            "${GITHUB_WORKSPACE}/build/CMakeCache.txt" || true

      - name: Build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --parallel "$(nproc)"

      - name: Run tests
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Run tests"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --target check

      - name: Verify debug build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify debug build"
          echo "========================================"

          BINARY="${GITHUB_WORKSPACE}/build/innoextract"

          test -x "${BINARY}"

          echo
          echo "Binary:"
          file "${BINARY}"

          echo
          echo "Debug sections:"
          readelf -S "${BINARY}" |
            grep -E '\.debug_|\.symtab' || {
              echo "ERROR: Debug information was not found."
              exit 1
            }

          echo
          echo "Original runtime dependencies:"
          LD_LIBRARY_PATH="${BOOST_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            ldd "${BINARY}"

      - name: Create Debian package directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create Debian package directory"
          echo "========================================"

          rm -rf "${PACKAGE_ROOT}"

          mkdir -p \
            "${PACKAGE_ROOT}/usr/bin" \
            "${PACKAGE_ROOT}/usr/lib/innoextract" \
            "${PACKAGE_ROOT}/DEBIAN"

          cp \
            "${GITHUB_WORKSPACE}/build/innoextract" \
            "${PACKAGE_ROOT}/usr/bin/innoextract"

          chmod 0755 \
            "${PACKAGE_ROOT}/usr/bin/innoextract"

          echo
          echo "Package binary:"
          ls -lh "${PACKAGE_ROOT}/usr/bin/innoextract"

      - name: Bundle Boost libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle Boost libraries"
          echo "========================================"

          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          BOOST_LIBRARIES=0

          while IFS= read -r library; do
            echo "Bundling Boost:"
            echo "  ${library}"

            cp -L \
              "${library}" \
              "${LIB_ROOT}/"

            BOOST_LIBRARIES=$((BOOST_LIBRARIES + 1))
          done < <(
            find "${BOOST_PREFIX}/lib" \
              -maxdepth 1 \
              -type f \
              -name 'libboost_*.so*' \
              -print \
              | sort
          )

          if [ "${BOOST_LIBRARIES}" -eq 0 ]; then
            echo
            echo "ERROR: No Boost shared libraries were found."
            exit 1
          fi

          echo
          echo "Bundled ${BOOST_LIBRARIES} Boost libraries."

          echo
          echo "Bundled Boost libraries:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -printf '%f\n' \
            | sort

      - name: Bundle runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle runtime libraries"
          echo "========================================"

          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          copy_library() {
            local source="$1"

            if [ ! -f "${source}" ]; then
              echo
              echo "ERROR: Runtime library does not exist:"
              echo "  ${source}"
              exit 1
            fi

            local filename
            filename="$(basename "${source}")"

            if [ -f "${LIB_ROOT}/${filename}" ]; then
              return 0
            fi

            echo "Bundling runtime library:"
            echo "  ${source}"

            cp -L \
              "${source}" \
              "${LIB_ROOT}/${filename}"
          }

          echo
          echo "Inspecting binary:"
          echo "  ${BINARY}"

          echo
          echo "Binary dependencies:"

          LD_LIBRARY_PATH="${BOOST_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            ldd "${BINARY}"

          echo
          echo "========================================"
          echo "Collect non-system dependencies"
          echo "========================================"

          while IFS= read -r library; do
            case "${library}" in
              /lib/*)
                ;;
              /lib64/*)
                ;;
              /usr/lib/*)
                ;;
              /usr/lib64/*)
                ;;
              /opt/boost/lib/*)
                ;;
              *)
                echo "Ignoring non-file dependency:"
                echo "  ${library}"
                continue
                ;;
            esac

            case "$(basename "${library}")" in
              libc.so.*)
                ;;
              libm.so.*)
                ;;
              libpthread.so.*)
                ;;
              librt.so.*)
                ;;
              libdl.so.*)
                ;;
              ld-linux*.so.*)
                ;;
              linux-vdso.so.*)
                ;;
              *)
                copy_library "${library}"
                ;;
            esac
          done < <(
            LD_LIBRARY_PATH="${BOOST_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
              ldd "${BINARY}" |
              sed -n 's/.*=> \([^ ]*\) (.*/\1/p' |
              sort -u
          )

          echo
          echo "========================================"
          echo "Explicitly verify required runtime libraries"
          echo "========================================"

          LZMA_LIBRARY="$(
            ldconfig -p |
              awk '/liblzma.so.5 / {print $NF; exit}'
          )"

          ZLIB_LIBRARY="$(
            ldconfig -p |
              awk '/libz.so.1 / {print $NF; exit}'
          )"

          BZIP2_LIBRARY="$(
            ldconfig -p |
              awk '/libbz2.so.1.0 / {print $NF; exit}'
          )"

          ZSTD_LIBRARY="$(
            ldconfig -p |
              awk '/libzstd.so.1 / {print $NF; exit}'
          )"

          if [ -z "${LZMA_LIBRARY}" ]; then
            echo "ERROR: Could not find liblzma.so.5"
            exit 1
          fi

          if [ -z "${ZLIB_LIBRARY}" ]; then
            echo "ERROR: Could not find libz.so.1"
            exit 1
          fi

          if [ -z "${BZIP2_LIBRARY}" ]; then
            echo "ERROR: Could not find libbz2.so.1.0"
            exit 1
          fi

          if [ -z "${ZSTD_LIBRARY}" ]; then
            echo "ERROR: Could not find libzstd.so.1"
            exit 1
          fi

          copy_library "${LZMA_LIBRARY}"
          copy_library "${ZLIB_LIBRARY}"
          copy_library "${BZIP2_LIBRARY}"
          copy_library "${ZSTD_LIBRARY}"

          echo
          echo "========================================"
          echo "Bundle compiler runtime"
          echo "========================================"

          LIBSTDCPP="$(g++ -print-file-name=libstdc++.so.6)"
          LIBGCC="$(gcc -print-file-name=libgcc_s.so.1)"

          case "${LIBSTDCPP}" in
            /*)
              copy_library "${LIBSTDCPP}"
              ;;
            *)
              echo "ERROR: Could not locate libstdc++.so.6"
              exit 1
              ;;
          esac

          case "${LIBGCC}" in
            /*)
              copy_library "${LIBGCC}"
              ;;
            *)
              echo "ERROR: Could not locate libgcc_s.so.1"
              exit 1
              ;;
          esac

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"

          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Set RPATH
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          patchelf \
            --set-rpath '$ORIGIN/../lib/innoextract' \
            "${BINARY}"

          RPATH="$(patchelf --print-rpath "${BINARY}")"

          echo "RPATH:"
          echo "${RPATH}"

          test "${RPATH}" = '$ORIGIN/../lib/innoextract'

      - name: Verify packaged dependency tree
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify packaged dependency tree"
          echo "========================================"

          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          echo
          echo "Package RPATH:"
          patchelf --print-rpath "${BINARY}"

          echo
          echo "Binary runtime dependencies:"

          LD_LIBRARY_PATH="" \
            ldd "${BINARY}"

          if ldd "${BINARY}" | grep -q 'not found'; then
            echo
            echo "ERROR: Binary has unresolved runtime dependencies."
            exit 1
          fi

          echo
          echo "Checking bundled shared libraries..."

          while IFS= read -r library; do
            echo
            echo "Checking:"
            echo "  ${library}"

            if ldd "${library}" | grep -q 'not found'; then
              echo
              echo "ERROR: Bundled library has unresolved dependencies:"
              echo "  ${library}"

              ldd "${library}"

              exit 1
            fi
          done < <(
            find "${LIB_ROOT}" \
              -maxdepth 1 \
              -type f \
              -name '*.so*' \
              -print \
              | sort
          )

          echo
          echo "All packaged shared libraries have resolvable dependencies."

      - name: Create package metadata
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create package metadata"
          echo "========================================"

          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: innoextract
          Description: Extract files from Inno Setup installers
           Debug build of innoextract with bundled runtime dependencies.
          EOF

          chmod 0644 \
            "${PACKAGE_ROOT}/DEBIAN/control"

          echo
          echo "Control file:"
          cat "${PACKAGE_ROOT}/DEBIAN/control"

      - name: Build Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
          PACKAGE="${GITHUB_WORKSPACE}/ci-output/innoextract_${VERSION}_amd64.deb"

          rm -f "${GITHUB_WORKSPACE}/ci-output/"*.deb

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PACKAGE_ROOT}" \
            "${PACKAGE}"

          test -f "${PACKAGE}"

          echo
          echo "Created package:"
          ls -lh "${PACKAGE}"

      - name: Inspect Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Inspect Debian package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo
          echo "Package:"
          echo "${PACKAGE}"

          echo
          echo "Package metadata:"
          dpkg-deb -I "${PACKAGE}"

          echo
          echo "Package contents:"
          dpkg-deb -c "${PACKAGE}"

      - name: Test package without installing dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Test package without external dependencies"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"
          TEST_ROOT="/tmp/innoextract-test"

          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}"

          dpkg-deb \
            --extract \
            "${PACKAGE}" \
            "${TEST_ROOT}"

          BINARY="${TEST_ROOT}/usr/bin/innoextract"

          test -x "${BINARY}"

          echo
          echo "========================================"
          echo "Package RPATH"
          echo "========================================"

          patchelf --print-rpath "${BINARY}"

          test \
            "$(patchelf --print-rpath "${BINARY}")" \
            = '$ORIGIN/../lib/innoextract'

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          LD_LIBRARY_PATH="" \
            ldd "${BINARY}"

          if ldd "${BINARY}" | grep -q 'not found'; then
            echo
            echo "ERROR: Binary has missing runtime libraries."
            exit 1
          fi

          echo
          echo "All binary runtime libraries found."

          echo
          echo "========================================"
          echo "Check bundled libraries"
          echo "========================================"

          while IFS= read -r library; do
            echo
            echo "Checking:"
            echo "  ${library}"

            if ldd "${library}" | grep -q 'not found'; then
              echo
              echo "ERROR: Bundled library has missing dependencies:"
              echo "  ${library}"

              ldd "${library}"

              exit 1
            fi
          done < <(
            find "${TEST_ROOT}/usr/lib/innoextract" \
              -maxdepth 1 \
              -type f \
              -name '*.so*' \
              -print \
              | sort
          )

          echo
          echo "All bundled libraries are self-consistent."

          echo
          echo "========================================"
          echo "Binary test"
          echo "========================================"

          LD_LIBRARY_PATH="" \
            "${BINARY}" --help >/dev/null

          echo
          echo "Packaged debug binary works."

      - name: Verify package is valid Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify Debian package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          dpkg-deb --info "${PACKAGE}" >/dev/null
          dpkg-deb --contents "${PACKAGE}" >/dev/null

          echo
          echo "Debian package is valid."

      - name: Final artifact check
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final artifact check"
          echo "========================================"

          echo
          echo "Output directory:"
          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Files:"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo
          echo "Exactly one Debian package found:"
          echo "${PACKAGE}"

          echo
          echo "Package size:"
          du -h "${PACKAGE}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          retention-days: 30
