name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: "on"
  DEBUG_EXTRA: "on"

jobs:

  linux:
    name: Debian 10 Debug build and package
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/ci-output"
          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          echo "GitHub workspace:"
          echo "${GITHUB_WORKSPACE}"

          echo
          echo "Output directory:"
          ls -la "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Debian 10 debug package
        env:
          DEBUG: "on"
          DEBUG_EXTRA: "on"
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -e DEBUG="${DEBUG}" \
            -e DEBUG_EXTRA="${DEBUG_EXTRA}" \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${GITHUB_WORKSPACE}:/src" \
            -v "${GITHUB_WORKSPACE}/ci-output:/out" \
            -w /src \
            debian:10 \
            bash -euxo pipefail <<'DOCKER_SCRIPT'

          export DEBIAN_FRONTEND=noninteractive

          echo
          echo "========================================"
          echo "Debian version"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'APT_SOURCES'
          deb http://archive.debian.org/debian buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
          APT_SOURCES

          cat > /etc/apt/apt.conf.d/99archive <<'APT_CONFIG'
          Acquire::Check-Valid-Until "false";
          APT_CONFIG

          apt-get update

          echo
          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            ca-certificates \
            xz-utils \
            bzip2 \
            tar \
            dpkg-dev \
            file \
            patchelf \
            pax-utils \
            pkg-config \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev

          echo
          echo "========================================"
          echo "Compiler versions"
          echo "========================================"

          gcc --version
          g++ --version
          cmake --version

          echo
          echo "========================================"
          echo "Environment"
          echo "========================================"

          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          echo
          echo "========================================"
          echo "Build Boost 1.83.0"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_VERSION_UNDERSCORE="1_83_0"

          cd /tmp

          wget \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.bz2" \
            -O boost.tar.bz2

          tar -xjf boost.tar.bz2

          cd "boost_${BOOST_VERSION_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix=/opt/boost

          ./b2 \
            -j"$(nproc)" \
            --prefix=/opt/boost \
            link=shared \
            runtime-link=shared \
            install

          echo
          echo "========================================"
          echo "Boost libraries"
          echo "========================================"

          find /opt/boost/lib \
            -maxdepth 1 \
            -type f \
            -name "libboost_*.so*" \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Configure innoextract"
          echo "========================================"

          cd /src

          rm -rf build

          export BOOST_ROOT=/opt/boost
          export CMAKE_PREFIX_PATH=/opt/boost

          cmake \
            -B /src/build \
            -Werror=dev \
            -Werror=deprecated \
            -DCONTINUOUS_INTEGRATION=1 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBoost_ROOT=/opt/boost \
            -DBoost_NO_SYSTEM_PATHS=ON

          echo
          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build /src/build \
            --parallel

          echo
          echo "========================================"
          echo "Unit tests"
          echo "========================================"

          cmake \
            --build /src/build \
            --target check

          echo
          echo "========================================"
          echo "Check style"
          echo "========================================"

          if cmake --build /src/build --target help | grep -qE '(^|[[:space:]])style([[:space:]]|$)'; then
            echo "Style target found."
            cmake --build /src/build --target style
          else
            echo "No style target exists. Skipping."
          fi

          echo
          echo "========================================"
          echo "Inspect binary"
          echo "========================================"

          file /src/build/innoextract

          echo
          echo "Runtime dependencies before packaging:"
          ldd /src/build/innoextract

          echo
          echo "========================================"
          echo "Prepare Debian package"
          echo "========================================"

          PKGROOT="/src/package"
          LIBDIR="${PKGROOT}/usr/lib/innoextract"

          rm -rf "${PKGROOT}"

          mkdir -p \
            "${PKGROOT}/DEBIAN" \
            "${PKGROOT}/usr/bin" \
            "${LIBDIR}"

          cp \
            /src/build/innoextract \
            "${PKGROOT}/usr/bin/innoextract"

          chmod 0755 \
            "${PKGROOT}/usr/bin/innoextract"

          echo
          echo "========================================"
          echo "Copy Boost runtime libraries"
          echo "========================================"

          find /opt/boost/lib \
            -maxdepth 1 \
            -type f \
            -name "libboost_*.so*" \
            -exec cp -L {} "${LIBDIR}/" \;

          echo
          echo "========================================"
          echo "Copy liblzma"
          echo "========================================"

          LZMA_PATH="$(ldconfig -p | awk '/liblzma.so.5/{print $NF; exit}')"

          if [ -z "${LZMA_PATH}" ]; then
            echo "ERROR: liblzma.so.5 not found"
            exit 1
          fi

          echo "Using ${LZMA_PATH}"

          cp -L \
            "${LZMA_PATH}" \
            "${LIBDIR}/"

          echo
          echo "========================================"
          echo "Do not bundle system runtimes"
          echo "========================================"

          rm -f \
            "${LIBDIR}/libstdc++.so.6" \
            "${LIBDIR}/libgcc_s.so.1" \
            "${LIBDIR}/libc.so.6" \
            "${LIBDIR}/libm.so.6" \
            "${LIBDIR}/libdl.so.2" \
            "${LIBDIR}/libpthread.so.0" \
            "${LIBDIR}/librt.so.1" \
            "${LIBDIR}/ld-linux-x86-64.so.2"

          echo
          echo "Libraries bundled into package:"
          find "${LIBDIR}" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          patchelf \
            --set-rpath /usr/lib/innoextract \
            "${PKGROOT}/usr/bin/innoextract"

          echo "RPATH:"
          patchelf \
            --print-rpath \
            "${PKGROOT}/usr/bin/innoextract"

          echo
          echo "========================================"
          echo "Verify packaged binary"
          echo "========================================"

          LD_LIBRARY_PATH="${LIBDIR}" \
            ldd "${PKGROOT}/usr/bin/innoextract"

          if LD_LIBRARY_PATH="${LIBDIR}" \
            ldd "${PKGROOT}/usr/bin/innoextract" \
            | grep -q "not found"; then

            echo "ERROR: Missing library before package creation."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Create Debian package metadata"
          echo "========================================"

          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
          ARCH="$(dpkg --print-architecture)"

          cat > "${PKGROOT}/DEBIAN/control" <<CONTROL
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: innoextract CI
          Description: Tool for extracting Inno Setup installers
           innoextract extracts files from installers created by Inno Setup.
          CONTROL

          echo
          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          OUTPUT="/out/innoextract_${VERSION}_${ARCH}.deb"

          rm -f /out/*.deb

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PKGROOT}" \
            "${OUTPUT}"

          echo
          echo "========================================"
          echo "Verify output"
          echo "========================================"

          if [ ! -f "${OUTPUT}" ]; then
            echo "ERROR: Debian package was not created:"
            echo "${OUTPUT}"
            exit 1
          fi

          ls -lh "${OUTPUT}"

          file "${OUTPUT}"

          echo
          echo "========================================"
          echo "Package information"
          echo "========================================"

          dpkg-deb \
            --info \
            "${OUTPUT}"

          echo
          echo "========================================"
          echo "Package contents"
          echo "========================================"

          dpkg-deb \
            --contents \
            "${OUTPUT}"

          echo
          echo "========================================"
          echo "Final output directory"
          echo "========================================"

          ls -lah /out

          echo
          echo "========================================"
          echo "Package created successfully"
          echo "========================================"

          DOCKER_SCRIPT

      - name: Verify artifact exists
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CI output"
          echo "========================================"

          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Debian packages:"
          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print

          DEB_COUNT="$(find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            | wc -l)"

          if [ "${DEB_COUNT}" -ne 1 ]; then
            echo "ERROR: Expected exactly one .deb package, found ${DEB_COUNT}."
            exit 1
          fi

          echo
          echo "Package ready for upload:"
          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -exec ls -lh {} \;

      - name: Test package on clean Debian 10
        run: |
          set -euo pipefail

          PACKAGE="$(find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print -quit)"

          docker run --rm \
            --user root \
            -v "${PACKAGE}:/work/package.deb:ro" \
            debian:10 \
            bash -euxo pipefail <<'DOCKER_TEST'

          export DEBIAN_FRONTEND=noninteractive

          echo
          echo "========================================"
          echo "Clean Debian 10 test"
          echo "========================================"

          cat /etc/os-release

          cat > /etc/apt/sources.list <<'APT_SOURCES'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          APT_SOURCES

          cat > /etc/apt/apt.conf.d/99archive <<'APT_CONFIG'
          Acquire::Check-Valid-Until "false";
          APT_CONFIG

          apt-get update

          apt-get install -y \
            ca-certificates \
            file

          echo
          echo "========================================"
          echo "Install package"
          echo "========================================"

          dpkg -i /work/package.deb

          echo
          echo "========================================"
          echo "Verify installation"
          echo "========================================"

          dpkg-query \
            -W \
            -f='${Status}\n' \
            innoextract

          test -x /usr/bin/innoextract

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          ldd /usr/bin/innoextract

          if ldd /usr/bin/innoextract | grep -q "not found"; then
            echo "ERROR: Missing runtime library."
            exit 1
          fi

          echo
          echo "All runtime libraries found."

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"

          find /usr/lib/innoextract \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "========================================"
          echo "Verify system C++ runtime is used"
          echo "========================================"

          if find /usr/lib/innoextract \
            -maxdepth 1 \
            \( \
              -name "libstdc++.so*" \
              -o -name "libgcc_s.so*" \
            \) \
            | grep -q .; then

            echo "ERROR: libstdc++ or libgcc is bundled."
            exit 1
          fi

          echo "No libstdc++/libgcc bundled."

          echo
          echo "========================================"
          echo "Run innoextract"
          echo "========================================"

          innoextract --help

          echo
          echo "========================================"
          echo "Debian 10 test successful"
          echo "========================================"

          DOCKER_TEST

      - name: Test package on Ubuntu latest
        run: |
          set -euo pipefail

          PACKAGE="$(find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print -quit)"

          docker run --rm \
            --user root \
            -v "${PACKAGE}:/work/package.deb:ro" \
            ubuntu:latest \
            bash -euxo pipefail <<'DOCKER_TEST'

          export DEBIAN_FRONTEND=noninteractive

          echo
          echo "========================================"
          echo "Clean Ubuntu latest test"
          echo "========================================"

          cat /etc/os-release

          apt-get update

          apt-get install -y \
            ca-certificates \
            file

          echo
          echo "========================================"
          echo "Install package"
          echo "========================================"

          dpkg -i /work/package.deb

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          ldd /usr/bin/innoextract

          if ldd /usr/bin/innoextract | grep -q "not found"; then
            echo "ERROR: Missing runtime library."
            exit 1
          fi

          echo
          echo "All runtime libraries found."

          echo
          echo "========================================"
          echo "Run innoextract"
          echo "========================================"

          innoextract --help

          echo
          echo "========================================"
          echo "Ubuntu latest test successful"
          echo "========================================"

          DOCKER_TEST

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-amd64-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          compression-level: 0
