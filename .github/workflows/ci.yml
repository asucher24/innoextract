name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: "on"
  DEBUG_EXTRA: "on"

jobs:

  linux:
    name: Debian 10 Debug build and package
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          set -euo pipefail

          rm -rf ci-output
          mkdir -p ci-output

      - name: Build Debian 10 debug package
        env:
          DEBUG: "on"
          DEBUG_EXTRA: "on"
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -e DEBUG="${DEBUG}" \
            -e DEBUG_EXTRA="${DEBUG_EXTRA}" \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${PWD}:/src" \
            -w /src \
            debian:10 \
            bash -euxo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive

              echo
              echo "========================================"
              echo "Debian version"
              echo "========================================"

              cat /etc/os-release

              echo
              echo "========================================"
              echo "Configure Debian 10 repositories"
              echo "========================================"

              cat > /etc/apt/sources.list <<EOF
deb http://archive.debian.org/debian buster main contrib non-free
deb http://archive.debian.org/debian-security buster/updates main contrib non-free
EOF

              cat > /etc/apt/apt.conf.d/99archive <<EOF
Acquire::Check-Valid-Until "false";
EOF

              apt-get update

              echo
              echo "========================================"
              echo "Install build dependencies"
              echo "========================================"

              apt-get install -y \
                build-essential \
                cmake \
                git \
                wget \
                ca-certificates \
                xz-utils \
                bzip2 \
                tar \
                dpkg-dev \
                file \
                patchelf \
                pax-utils \
                pkg-config \
                liblzma-dev \
                zlib1g-dev \
                libbz2-dev

              echo
              echo "========================================"
              echo "Compiler"
              echo "========================================"

              gcc --version
              g++ --version
              cmake --version

              echo
              echo "========================================"
              echo "Environment"
              echo "========================================"

              echo "DEBUG=${DEBUG}"
              echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

              echo
              echo "========================================"
              echo "Build Boost 1.83.0"
              echo "========================================"

              BOOST_VERSION="1.83.0"
              BOOST_VERSION_UNDERSCORE="1_83_0"

              cd /tmp

              wget \
                "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.bz2" \
                -O boost.tar.bz2

              tar -xjf boost.tar.bz2

              cd "boost_${BOOST_VERSION_UNDERSCORE}"

              ./bootstrap.sh \
                --prefix=/opt/boost

              ./b2 \
                -j"$(nproc)" \
                --prefix=/opt/boost \
                link=shared \
                runtime-link=shared \
                install

              echo
              echo "========================================"
              echo "Boost libraries"
              echo "========================================"

              find /opt/boost/lib \
                -maxdepth 1 \
                -type f \
                -name "libboost_*.so*" \
                -print \
                | sort

              echo
              echo "========================================"
              echo "Configure innoextract"
              echo "========================================"

              cd /src

              rm -rf build

              export BOOST_ROOT=/opt/boost
              export CMAKE_PREFIX_PATH=/opt/boost

              cmake \
                -B /src/build \
                -Werror=dev \
                -Werror=deprecated \
                -DCONTINUOUS_INTEGRATION=1 \
                -DCMAKE_BUILD_TYPE=Debug \
                -DBoost_ROOT=/opt/boost \
                -DBoost_NO_SYSTEM_PATHS=ON \
                -DCMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc"

              echo
              echo "========================================"
              echo "CMake configuration"
              echo "========================================"

              grep -E \
                "CMAKE_BUILD_TYPE|Boost|CMAKE_CXX_FLAGS" \
                /src/build/CMakeCache.txt \
                || true

              echo
              echo "========================================"
              echo "Build"
              echo "========================================"

              cmake \
                --build /src/build \
                --parallel

              echo
              echo "========================================"
              echo "Unit tests"
              echo "========================================"

              if cmake --build /src/build --target check; then
                echo "Unit tests passed."
              else
                echo "Unit test target failed."
                exit 1
              fi

              echo
              echo "========================================"
              echo "Check style"
              echo "========================================"

              if cmake --build /src/build --target help | grep -qE "(^|[[:space:]])style([[:space:]]|$)"; then
                echo "Style target found."
                cmake --build /src/build --target style
              else
                echo "No style target exists."
                echo "Skipping style check."
              fi

              echo
              echo "========================================"
              echo "Verify debug binary"
              echo "========================================"

              file /src/build/innoextract

              echo
              echo "Compiler/linker information:"
              readelf -p .comment /src/build/innoextract || true

              echo
              echo "Runtime dependencies:"
              ldd /src/build/innoextract

              echo
              echo "========================================"
              echo "Prepare Debian package"
              echo "========================================"

              PKGROOT="/src/package"
              LIBDIR="${PKGROOT}/usr/lib/innoextract"

              rm -rf "${PKGROOT}"

              mkdir -p \
                "${PKGROOT}/DEBIAN" \
                "${PKGROOT}/usr/bin" \
                "${LIBDIR}"

              cp \
                /src/build/innoextract \
                "${PKGROOT}/usr/bin/innoextract"

              chmod 0755 \
                "${PKGROOT}/usr/bin/innoextract"

              echo
              echo "========================================"
              echo "Copy Boost runtime libraries"
              echo "========================================"

              find /opt/boost/lib \
                -maxdepth 1 \
                -type f \
                -name "libboost_*.so*" \
                -exec cp -L {} "${LIBDIR}/" \;

              echo
              echo "========================================"
              echo "Copy liblzma"
              echo "========================================"

              LZMA_PATH="$(ldconfig -p | awk "/liblzma.so.5/{print \$NF; exit}")"

              if [ -z "${LZMA_PATH}" ]; then
                echo "ERROR: liblzma.so.5 not found"
                exit 1
              fi

              echo "Using ${LZMA_PATH}"

              cp -L \
                "${LZMA_PATH}" \
                "${LIBDIR}/"

              echo
              echo "========================================"
              echo "Remove system runtime libraries"
              echo "========================================"

              rm -f \
                "${LIBDIR}/libstdc++.so.6" \
                "${LIBDIR}/libgcc_s.so.1" \
                "${LIBDIR}/libc.so.6" \
                "${LIBDIR}/libm.so.6" \
                "${LIBDIR}/libdl.so.2" \
                "${LIBDIR}/libpthread.so.0" \
                "${LIBDIR}/librt.so.1" \
                "${LIBDIR}/ld-linux-x86-64.so.2"

              echo
              echo "Libraries in package:"
              find "${LIBDIR}" \
                -maxdepth 1 \
                -type f \
                -printf "%f\n" \
                | sort

              echo
              echo "========================================"
              echo "Set RPATH"
              echo "========================================"

              patchelf \
                --set-rpath /usr/lib/innoextract \
                "${PKGROOT}/usr/bin/innoextract"

              echo "RPATH:"
              patchelf \
                --print-rpath \
                "${PKGROOT}/usr/bin/innoextract"

              echo
              echo "========================================"
              echo "Verify packaged binary"
              echo "========================================"

              LD_LIBRARY_PATH="${LIBDIR}" \
                ldd "${PKGROOT}/usr/bin/innoextract"

              echo
              echo "========================================"
              echo "Create package metadata"
              echo "========================================"

              VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
              ARCH="$(dpkg --print-architecture)"

              cat > "${PKGROOT}/DEBIAN/control" <<EOF
Package: innoextract
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: ${ARCH}
Maintainer: innoextract CI
Description: Tool for extracting Inno Setup installers
 innoextract extracts files from installers created by Inno Setup.
EOF

              echo
              echo "========================================"
              echo "Build Debian package"
              echo "========================================"

              dpkg-deb \
                --build \
                --root-owner-group \
                "${PKGROOT}" \
                "/src/ci-output/innoextract_${VERSION}_${ARCH}.deb"

              echo
              echo "========================================"
              echo "Inspect package"
              echo "========================================"

              dpkg-deb \
                --info \
                /src/ci-output/innoextract_*.deb

              echo
              echo "Package contents:"
              dpkg-deb \
                --contents \
                /src/ci-output/innoextract_*.deb

              echo
              echo "========================================"
              echo "Verify package does NOT contain system C++ runtime"
              echo "========================================"

              if dpkg-deb --contents /src/ci-output/innoextract_*.deb \
                | grep -E \
                  "/(libstdc\+\+|libgcc_s|libc|libm|libdl|libpthread|librt|ld-linux)" \
                  ; then

                echo
                echo "ERROR: Package contains forbidden system runtime libraries."
                exit 1
              fi

              echo
              echo "Package structure is valid."

              echo
              echo "========================================"
              echo "Build successful"
              echo "========================================"
            '

      - name: Test package on clean Debian 10
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -v "${PWD}/ci-output:/work:ro" \
            debian:10 \
            bash -euxo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive

              echo
              echo "========================================"
              echo "Clean Debian 10"
              echo "========================================"

              cat /etc/os-release

              cat > /etc/apt/sources.list <<EOF
deb http://archive.debian.org/debian buster main
deb http://archive.debian.org/debian-security buster/updates main
EOF

              cat > /etc/apt/apt.conf.d/99archive <<EOF
Acquire::Check-Valid-Until "false";
EOF

              apt-get update

              apt-get install -y \
                ca-certificates \
                file

              echo
              echo "========================================"
              echo "Install package with dpkg"
              echo "========================================"

              dpkg -i /work/innoextract_*.deb

              echo
              echo "========================================"
              echo "Check dpkg dependencies"
              echo "========================================"

              if dpkg-query \
                -W \
                -f="\${Status}\n" \
                innoextract \
                | grep -q "install ok installed"; then

                echo "Package installed successfully."
              else
                echo "ERROR: Package installation failed."
                exit 1
              fi

              echo
              echo "========================================"
              echo "Check binary"
              echo "========================================"

              command -v innoextract
              file /usr/bin/innoextract

              echo
              echo "========================================"
              echo "Runtime dependencies"
              echo "========================================"

              ldd /usr/bin/innoextract

              echo
              echo "========================================"
              echo "Check missing libraries"
              echo "========================================"

              if ldd /usr/bin/innoextract | grep -q "not found"; then
                echo "ERROR: Missing runtime library."
                exit 1
              fi

              echo "All runtime libraries resolved."

              echo
              echo "========================================"
              echo "Check bundled libraries"
              echo "========================================"

              ls -lah /usr/lib/innoextract

              echo
              echo "========================================"
              echo "Verify system libstdc++ is NOT bundled"
              echo "========================================"

              if find /usr/lib/innoextract \
                -maxdepth 1 \
                \( \
                  -name "libstdc++.so*" \
                  -o -name "libgcc_s.so*" \
                \) \
                | grep -q .; then

                echo "ERROR: libstdc++ or libgcc is bundled."
                exit 1
              fi

              echo "System C++ runtime is used."

              echo
              echo "========================================"
              echo "Run innoextract"
              echo "========================================"

              innoextract --help

              echo
              echo "========================================"
              echo "Debian 10 test successful"
              echo "========================================"
            '

      - name: Test package on Ubuntu latest
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -v "${PWD}/ci-output:/work:ro" \
            ubuntu:latest \
            bash -euxo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive

              echo
              echo "========================================"
              echo "Clean Ubuntu latest"
              echo "========================================"

              cat /etc/os-release

              apt-get update

              apt-get install -y \
                ca-certificates \
                file

              echo
              echo "========================================"
              echo "Install package"
              echo "========================================"

              dpkg -i /work/innoextract_*.deb

              echo
              echo "========================================"
              echo "Runtime dependencies"
              echo "========================================"

              ldd /usr/bin/innoextract

              echo
              echo "========================================"
              echo "Check missing libraries"
              echo "========================================"

              if ldd /usr/bin/innoextract | grep -q "not found"; then
                echo "ERROR: Missing runtime library."
                exit 1
              fi

              echo "All runtime libraries resolved."

              echo
              echo "========================================"
              echo "Run innoextract"
              echo "========================================"

              innoextract --help

              echo
              echo "========================================"
              echo "Ubuntu latest test successful"
              echo "========================================"
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-amd64-debug
          path: ci-output/*.deb
          if-no-files-found: error
