name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: "on"
  DEBUG_EXTRA: "on"

jobs:

  linux:
    name: Debian 10 debug build
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Prepare output directory
      # ============================================================

      - name: Prepare output directory
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/ci-output"

          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          echo "========================================"
          echo "GitHub workspace"
          echo "========================================"

          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

          echo
          ls -lah "${GITHUB_WORKSPACE}"

          echo
          echo "CI output:"
          ls -lah "${GITHUB_WORKSPACE}/ci-output"

      # ============================================================
      # Build
      #
      # IMPORTANT:
      #
      # The container itself is kept alive while we build.
      # The resulting .deb is copied out using docker cp.
      #
      # We deliberately do NOT use an /out bind mount.
      # ============================================================

      - name: Build Debian 10 package
        env:
          DEBUG: "on"
          DEBUG_EXTRA: "on"
        run: |
          set -euo pipefail

          CONTAINER_NAME="innoextract-build-${GITHUB_RUN_ID}"

          echo "========================================"
          echo "Create Debian 10 container"
          echo "========================================"

          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true

          docker create \
            --name "${CONTAINER_NAME}" \
            --user root \
            -e DEBUG="${DEBUG}" \
            -e DEBUG_EXTRA="${DEBUG_EXTRA}" \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            debian:10 \
            bash -c 'sleep infinity'

          docker start "${CONTAINER_NAME}"

          echo
          echo "Container:"
          docker ps -a \
            --filter "name=${CONTAINER_NAME}"

          # ----------------------------------------------------------
          # Always remove the container after this step.
          # ----------------------------------------------------------

          cleanup() {
            echo
            echo "========================================"
            echo "Remove build container"
            echo "========================================"

            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          # ==========================================================
          # Build inside Debian 10
          # ==========================================================

          docker exec \
            -e DEBUG="${DEBUG}" \
            -e DEBUG_EXTRA="${DEBUG_EXTRA}" \
            "${CONTAINER_NAME}" \
            bash -euxo pipefail -c '

          export DEBIAN_FRONTEND=noninteractive

          echo
          echo "========================================"
          echo "Debian version"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'"'"'APT_SOURCES'"'"'
          deb http://archive.debian.org/debian buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
          APT_SOURCES

          cat > /etc/apt/apt.conf.d/99archive <<'"'"'APT_CONFIG'"'"'
          Acquire::Check-Valid-Until "false";
          APT_CONFIG

          apt-get update

          echo
          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            ca-certificates \
            xz-utils \
            bzip2 \
            tar \
            dpkg-dev \
            file \
            patchelf \
            pkg-config \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev

          echo
          echo "========================================"
          echo "Compiler versions"
          echo "========================================"

          gcc --version
          g++ --version
          cmake --version

          # ==========================================================
          # Verify environment
          # ==========================================================

          echo
          echo "========================================"
          echo "Debug environment"
          echo "========================================"

          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          test "${DEBUG}" = "on"
          test "${DEBUG_EXTRA}" = "on"

          # ==========================================================
          # Build Boost 1.83.0
          # ==========================================================

          echo
          echo "========================================"
          echo "Build Boost 1.83.0"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_VERSION_UNDERSCORE="1_83_0"

          cd /tmp

          rm -rf "boost_${BOOST_VERSION_UNDERSCORE}"
          rm -f boost.tar.bz2

          wget \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.bz2" \
            -O boost.tar.bz2

          tar \
            -xjf boost.tar.bz2

          cd "boost_${BOOST_VERSION_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix=/opt/boost

          ./b2 \
            -j"$(nproc)" \
            --prefix=/opt/boost \
            --with-iostreams \
            --with-filesystem \
            --with-program_options \
            --with-date_time \
            --with-system \
            link=shared \
            runtime-link=shared \
            install

          echo
          echo "Boost libraries:"
          find /opt/boost/lib \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -print \
            | sort

          # ==========================================================
          # Configure innoextract
          #
          # IMPORTANT:
          #
          # CMAKE_BUILD_TYPE=Debug is explicitly set.
          #
          # DEBUG and DEBUG_EXTRA are also explicitly enabled.
          # ==========================================================

          echo
          echo "========================================"
          echo "Configure innoextract"
          echo "========================================"

          cd /src

          rm -rf /src/build

          export BOOST_ROOT=/opt/boost
          export CMAKE_PREFIX_PATH=/opt/boost

          cmake \
            -B /src/build \
            -Werror=dev \
            -Werror=deprecated \
            -DCONTINUOUS_INTEGRATION=1 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEBUG=ON \
            -DDEBUG_EXTRA=ON \
            -DBoost_ROOT=/opt/boost \
            -DBoost_NO_SYSTEM_PATHS=ON

          # ==========================================================
          # Verify CMake configuration
          # ==========================================================

          echo
          echo "========================================"
          echo "Verify CMake configuration"
          echo "========================================"

          echo
          echo "CMAKE_BUILD_TYPE:"
          grep '^CMAKE_BUILD_TYPE:' \
            /src/build/CMakeCache.txt

          echo
          echo "DEBUG:"
          grep '^DEBUG:' \
            /src/build/CMakeCache.txt \
            || true

          echo
          echo "DEBUG_EXTRA:"
          grep '^DEBUG_EXTRA:' \
            /src/build/CMakeCache.txt \
            || true

          echo
          echo "Boost:"
          grep -E \
            '^(Boost_ROOT|BOOST_ROOT|CMAKE_PREFIX_PATH):' \
            /src/build/CMakeCache.txt \
            || true

          # This is the important check.
          grep -q '^CMAKE_BUILD_TYPE:STRING=Debug$' \
            /src/build/CMakeCache.txt

          # Depending on how the project declares these options,
          # they may be BOOL or STRING. Therefore accept either
          # representation, but require ON.

          if grep -qE '^DEBUG:(BOOL|STRING)=ON$' \
            /src/build/CMakeCache.txt; then
            echo "DEBUG=ON confirmed."
          else
            echo "WARNING: DEBUG was not found as a CMake cache option."
          fi

          if grep -qE '^DEBUG_EXTRA:(BOOL|STRING)=ON$' \
            /src/build/CMakeCache.txt; then
            echo "DEBUG_EXTRA=ON confirmed."
          else
            echo "WARNING: DEBUG_EXTRA was not found as a CMake cache option."
          fi

          # ==========================================================
          # Build
          # ==========================================================

          echo
          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build /src/build \
            --parallel

          # ==========================================================
          # Tests
          # ==========================================================

          echo
          echo "========================================"
          echo "Unit tests"
          echo "========================================"

          if cmake --build /src/build --target help | \
            grep -qE '(^|[[:space:]])check([[:space:]]|$)'; then

            cmake \
              --build /src/build \
              --target check

          else
            echo "No check target exists. Skipping."
          fi

          # ==========================================================
          # Style
          # ==========================================================

          echo
          echo "========================================"
          echo "Style check"
          echo "========================================"

          if cmake --build /src/build --target help | \
            grep -qE '(^|[[:space:]])style([[:space:]]|$)'; then

            cmake \
              --build /src/build \
              --target style

          else
            echo "No style target exists. Skipping."
          fi

          # ==========================================================
          # Inspect binary
          # ==========================================================

          echo
          echo "========================================"
          echo "Built binary"
          echo "========================================"

          test -f /src/build/innoextract

          file /src/build/innoextract

          echo
          echo "Binary size:"
          ls -lh /src/build/innoextract

          echo
          echo "Runtime dependencies:"
          ldd /src/build/innoextract

          # ==========================================================
          # IMPORTANT DEBUG CHECK
          #
          # The previous problem was:
          #
          #     innoextract: unrecognised option --debug
          #
          # We now verify that --debug is actually compiled in.
          # ==========================================================

          echo
          echo "========================================"
          echo "Verify debug CLI"
          echo "========================================"

          /src/build/innoextract \
            --debug \
            --help \
            >/tmp/innoextract-debug-help.txt

          echo
          echo "Debug invocation succeeded."

          cat /tmp/innoextract-debug-help.txt

          # ==========================================================
          # Prepare Debian package
          # ==========================================================

          echo
          echo "========================================"
          echo "Prepare Debian package"
          echo "========================================"

          PKGROOT="/tmp/innoextract-package"
          LIBDIR="${PKGROOT}/usr/lib/innoextract"
          OUTPUTDIR="/tmp/final-output"

          rm -rf \
            "${PKGROOT}" \
            "${OUTPUTDIR}"

          mkdir -p \
            "${PKGROOT}/DEBIAN" \
            "${PKGROOT}/usr/bin" \
            "${LIBDIR}" \
            "${OUTPUTDIR}"

          cp \
            /src/build/innoextract \
            "${PKGROOT}/usr/bin/innoextract"

          chmod 0755 \
            "${PKGROOT}/usr/bin/innoextract"

          # ==========================================================
          # Collect runtime dependencies
          # ==========================================================

          echo
          echo "========================================"
          echo "Collect runtime libraries"
          echo "========================================"

          copy_library() {
            local LIB="$1"

            if [ -z "${LIB}" ]; then
              return
            fi

            case "${LIB}" in

              /lib/x86_64-linux-gnu/libc.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

              /lib/x86_64-linux-gnu/libm.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

              /lib/x86_64-linux-gnu/libdl.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

              /lib/x86_64-linux-gnu/libpthread.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

              /lib/x86_64-linux-gnu/librt.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

              /lib/x86_64-linux-gnu/ld-linux*.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

              /lib64/ld-linux*.so.*)
                echo "SYSTEM: ${LIB}"
                return
                ;;

            esac

            if [ -f "${LIB}" ]; then
              echo "BUNDLE: ${LIB}"
              cp -L "${LIB}" "${LIBDIR}/"
            else
              echo "WARNING: library not found: ${LIB}"
            fi
          }

          # ----------------------------------------------------------
          # Copy all direct runtime dependencies reported by ldd.
          # ----------------------------------------------------------

          while read -r LIB; do
            copy_library "${LIB}"
          done < <(
            ldd /src/build/innoextract |
              awk '
                /=>/ && $3 ~ /^\// {print $3}
                !/=>/ && $1 ~ /^\// {print $1}
              '
          )

          # ----------------------------------------------------------
          # Explicitly bundle Boost.
          # ----------------------------------------------------------

          find /opt/boost/lib \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -exec cp -L {} "${LIBDIR}/" \;

          # ----------------------------------------------------------
          # Explicitly bundle liblzma.
          # ----------------------------------------------------------

          LZMA_PATH="$(
            ldconfig -p |
              awk '/liblzma.so.5/{print $NF; exit}'
          )"

          if [ -n "${LZMA_PATH}" ] && [ -f "${LZMA_PATH}" ]; then
            cp -L \
              "${LZMA_PATH}" \
              "${LIBDIR}/"
          fi

          # ----------------------------------------------------------
          # Explicitly bundle zlib/bzip2/zstd if present.
          # ----------------------------------------------------------

          for LIB in \
            /lib/x86_64-linux-gnu/libz.so.1 \
            /lib/x86_64-linux-gnu/libbz2.so.1.0 \
            /lib/x86_64-linux-gnu/libzstd.so.1
          do
            if [ -f "${LIB}" ]; then
              cp -L "${LIB}" "${LIBDIR}/"
            fi
          done

          # ==========================================================
          # Never bundle glibc / loader
          # ==========================================================

          rm -f \
            "${LIBDIR}/libc.so."* \
            "${LIBDIR}/libm.so."* \
            "${LIBDIR}/libdl.so."* \
            "${LIBDIR}/libpthread.so."* \
            "${LIBDIR}/librt.so."* \
            "${LIBDIR}/ld-linux"* \
            "${LIBDIR}/libresolv.so."*

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"

          find "${LIBDIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          # ==========================================================
          # Set RPATH
          # ==========================================================

          echo
          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          patchelf \
            --set-rpath /usr/lib/innoextract \
            "${PKGROOT}/usr/bin/innoextract"

          echo
          echo "RPATH:"
          patchelf \
            --print-rpath \
            "${PKGROOT}/usr/bin/innoextract"

          # ==========================================================
          # Verify packaged binary before building .deb
          # ==========================================================

          echo
          echo "========================================"
          echo "Verify packaged binary"
          echo "========================================"

          ldd "${PKGROOT}/usr/bin/innoextract"

          if ldd "${PKGROOT}/usr/bin/innoextract" |
            grep -q 'not found'; then

            echo
            echo "ERROR: Missing runtime library."
            exit 1
          fi

          echo
          echo "All runtime libraries found."

          # ==========================================================
          # Debian metadata
          # ==========================================================

          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
          ARCH="$(dpkg --print-architecture)"

          cat > "${PKGROOT}/DEBIAN/control" <<CONTROL
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: innoextract CI
          Depends: libc6 (>= 2.28)
          Description: Tool for extracting Inno Setup installers
           innoextract extracts files from installers created by Inno Setup.
           This is a debug build with bundled runtime libraries.
          CONTROL

          # ==========================================================
          # Build .deb
          # ==========================================================

          echo
          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          OUTPUT="${OUTPUTDIR}/innoextract_${VERSION}_${ARCH}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PKGROOT}" \
            "${OUTPUT}"

          # ==========================================================
          # Verify .deb
          # ==========================================================

          echo
          echo "========================================"
          echo "Debian package"
          echo "========================================"

          test -f "${OUTPUT}"

          ls -lh "${OUTPUT}"

          file "${OUTPUT}"

          echo
          echo "Package metadata:"
          dpkg-deb --info "${OUTPUT}"

          echo
          echo "Package contents:"
          dpkg-deb --contents "${OUTPUT}"

          # ==========================================================
          # Verify the package itself
          # ==========================================================

          echo
          echo "========================================"
          echo "Install package inside build container"
          echo "========================================"

          dpkg -i "${OUTPUT}"

          echo
          echo "Installed binary:"
          ls -lh /usr/bin/innoextract

          echo
          echo "Installed runtime dependencies:"
          ldd /usr/bin/innoextract

          if ldd /usr/bin/innoextract |
            grep -q "not found"; then

            echo
            echo "ERROR: Installed package has missing libraries."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Run installed debug binary"
          echo "========================================"

          /usr/bin/innoextract \
            --debug \
            --help \
            >/tmp/installed-debug-help.txt

          cat /tmp/installed-debug-help.txt

          echo
          echo "Installed debug binary works."

          # ==========================================================
          # Final output
          # ==========================================================

          echo
          echo "========================================"
          echo "Final container output"
          echo "========================================"

          find /tmp/final-output \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -ls

          DEB_COUNT="$(
            find /tmp/final-output \
              -maxdepth 1 \
              -type f \
              -name '*.deb' |
              wc -l
          )"

          test "${DEB_COUNT}" -eq 1

          echo
          echo "Debian package successfully created."
          '

          # ==========================================================
          # Copy artifact OUT of Docker.
          #
          # This is the ONLY Docker -> GitHub artifact transfer.
          # ==========================================================

          echo
          echo "========================================"
          echo "Copy .deb from Docker"
          echo "========================================"

          docker cp \
            "${CONTAINER_NAME}:/tmp/final-output/." \
            "${GITHUB_WORKSPACE}/ci-output/"

          echo
          echo "Files copied:"
          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -print

          # ==========================================================
          # Validate exactly one artifact exists.
          # ==========================================================

          DEB_COUNT="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' |
              wc -l
          )"

          if [ "${DEB_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one .deb."
            echo "Found: ${DEB_COUNT}"

            echo
            echo "ci-output:"
            ls -lah "${GITHUB_WORKSPACE}/ci-output"

            echo
            echo "Container:"
            docker ps -a \
              --filter "name=${CONTAINER_NAME}"

            exit 1
          fi

          echo
          echo "Artifact successfully copied."

      # ============================================================
      # Test ACTUAL artifact on clean Debian 10
      # ============================================================

      - name: Test package on clean Debian 10
        run: |
          set -euo pipefail

          PACKAGE="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print -quit
          )"

          echo "========================================"
          echo "Clean Debian 10 test"
          echo "========================================"

          echo "Package:"
          echo "${PACKAGE}"

          docker run \
            --rm \
            --user root \
            -v "${PACKAGE}:/work/package.deb:ro" \
            debian:10 \
            bash -euxo pipefail -c '

          export DEBIAN_FRONTEND=noninteractive

          cat /etc/os-release

          cat > /etc/apt/sources.list <<'"'"'APT_SOURCES'"'"'
          deb http://archive.debian.org/debian buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
          APT_SOURCES

          cat > /etc/apt/apt.conf.d/99archive <<'"'"'APT_CONFIG'"'"'
          Acquire::Check-Valid-Until "false";
          APT_CONFIG

          apt-get update

          apt-get install -y \
            ca-certificates \
            file

          echo
          echo "========================================"
          echo "Install .deb"
          echo "========================================"

          dpkg -i /work/package.deb

          echo
          echo "========================================"
          echo "Verify runtime dependencies"
          echo "========================================"

          ldd /usr/bin/innoextract

          if ldd /usr/bin/innoextract |
            grep -q "not found"; then

            echo "ERROR: Missing runtime dependency."
            exit 1
          fi

          echo
          echo "All runtime dependencies found."

          echo
          echo "========================================"
          echo "Verify bundled Boost"
          echo "========================================"

          find /usr/lib/innoextract \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -print

          if ! find /usr/lib/innoextract \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' |
            grep -q .; then

            echo "ERROR: Boost libraries are not bundled."
            exit 1
          fi

          echo
          echo "Boost is bundled."

          echo
          echo "========================================"
          echo "Verify debug build"
          echo "========================================"

          /usr/bin/innoextract \
            --debug \
            --help \
            >/tmp/debug-help.txt

          cat /tmp/debug-help.txt

          echo
          echo "Debug build works."

          echo
          echo "========================================"
          echo "Debian 10 test successful"
          echo "========================================"
          '

      # ============================================================
      # Test ACTUAL artifact on Ubuntu latest
      # ============================================================

      - name: Test package on Ubuntu latest
        run: |
          set -euo pipefail

          PACKAGE="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print -quit
          )"

          echo "========================================"
          echo "Clean Ubuntu latest test"
          echo "========================================"

          docker run \
            --rm \
            --user root \
            -v "${PACKAGE}:/work/package.deb:ro" \
            ubuntu:latest \
            bash -euxo pipefail -c '

          export DEBIAN_FRONTEND=noninteractive

          cat /etc/os-release

          apt-get update

          apt-get install -y \
            ca-certificates \
            file

          echo
          echo "========================================"
          echo "Install .deb"
          echo "========================================"

          dpkg -i /work/package.deb

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          ldd /usr/bin/innoextract

          if ldd /usr/bin/innoextract |
            grep -q "not found"; then

            echo "ERROR: Missing runtime dependency."
            exit 1
          fi

          echo
          echo "All runtime dependencies found."

          echo
          echo "========================================"
          echo "Run debug binary"
          echo "========================================"

          /usr/bin/innoextract \
            --debug \
            --help \
            >/tmp/debug-help.txt

          cat /tmp/debug-help.txt

          echo
          echo "Debug binary works on Ubuntu latest."

          echo
          echo "========================================"
          echo "Ubuntu latest test successful"
          echo "========================================"
          '

      # ============================================================
      # Final artifact verification
      # ============================================================

      - name: Verify final artifact
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CI output"
          echo "========================================"

          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Debian packages:"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print

          DEB_COUNT="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' |
              wc -l
          )"

          if [ "${DEB_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one .deb package."
            echo "Found: ${DEB_COUNT}"
            exit 1
          fi

          PACKAGE="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print -quit
          )"

          echo
          echo "========================================"
          echo "Final artifact"
          echo "========================================"

          echo "${PACKAGE}"

          echo
          echo "Size:"
          du -h "${PACKAGE}"

          echo
          echo "Type:"
          file "${PACKAGE}"

          echo
          echo "Package metadata:"
          dpkg-deb --info "${PACKAGE}"

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-amd64-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          compression-level: 0
