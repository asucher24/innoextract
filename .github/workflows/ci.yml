name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: on
  DEBUG_EXTRA: on

jobs:

  linux:
    name: Linux build and Debian package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Update
      run: sudo apt-get update

    - name: Dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          liblzma-dev \
          dpkg-dev \
          patchelf \
          pax-utils

    - name: Show toolchain versions
      run: |
        cmake --version
        gcc --version
        g++ --version
        dpkg --print-architecture

    - name: Configure
      run: |
        cmake \
          -B "${{ github.workspace }}/build" \
          -Werror=dev \
          -Werror=deprecated \
          -DCONTINUOUS_INTEGRATION=1

    - name: Build
      run: |
        cmake \
          --build "${{ github.workspace }}/build" \
          --parallel

    - name: Check Style
      run: |
        cmake \
          --build "${{ github.workspace }}/build" \
          --target style

    - name: Show binary dependencies
      run: |
        echo "Binary:"
        file build/innoextract

        echo
        echo "Dependencies:"
        ldd build/innoextract

    - name: Prepare Debian package
      shell: bash
      run: |
        set -euo pipefail

        PKGROOT="${PWD}/package"
        LIBDIR="${PKGROOT}/usr/lib/innoextract"

        rm -rf "$PKGROOT"

        mkdir -p \
          "${PKGROOT}/DEBIAN" \
          "${PKGROOT}/usr/bin" \
          "$LIBDIR"

        # Binary
        cp \
          build/innoextract \
          "${PKGROOT}/usr/bin/innoextract"

        chmod 0755 \
          "${PKGROOT}/usr/bin/innoextract"

        echo "========================================"
        echo "Original binary dependencies"
        echo "========================================"

        ldd build/innoextract

        echo
        echo "========================================"
        echo "Collecting recursive dependencies"
        echo "========================================"

        # lddtree liefert alle Libraries rekursiv.
        lddtree -l build/innoextract > /tmp/all-libraries.txt

        cat /tmp/all-libraries.txt

        echo
        echo "========================================"
        echo "Bundling libraries"
        echo "========================================"

        while read -r LIB; do

          # Nur absolute Pfade berücksichtigen.
          [[ "$LIB" = /* ]] || continue

          BASENAME="$(basename "$LIB")"

          # Dynamic Loader und glibc NICHT mitliefern.
          case "$BASENAME" in
            ld-linux*.so*)
              echo "System library (dynamic loader): $LIB"
              continue
              ;;

            libc.so.*)
              echo "System library (glibc): $LIB"
              continue
              ;;

            libm.so.*)
              echo "System library (glibc): $LIB"
              continue
              ;;

            libdl.so.*)
              echo "System library (glibc): $LIB"
              continue
              ;;

            libpthread.so.*)
              echo "System library (glibc): $LIB"
              continue
              ;;

            librt.so.*)
              echo "System library (glibc): $LIB"
              continue
              ;;
          esac

          echo "Bundling: $LIB"
          cp -L "$LIB" "$LIBDIR/$BASENAME"

        done < /tmp/all-libraries.txt

        echo
        echo "========================================"
        echo "Bundled libraries"
        echo "========================================"

        ls -lah "$LIBDIR"

        echo
        echo "========================================"
        echo "Setting RPATH"
        echo "========================================"

        patchelf \
          --set-rpath /usr/lib/innoextract \
          "${PKGROOT}/usr/bin/innoextract"

        patchelf \
          --print-rpath \
          "${PKGROOT}/usr/bin/innoextract"

    - name: Create Debian control file
      shell: bash
      run: |
        set -euo pipefail

        VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
        ARCH="$(dpkg --print-architecture)"

        cat > package/DEBIAN/control <<EOF
        Package: innoextract
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: ${ARCH}
        Maintainer: innoextract CI
        Description: Tool for extracting Inno Setup installers
         innoextract extracts files from installers created by Inno Setup.
        EOF

    - name: Build Debian package
      shell: bash
      run: |
        set -euo pipefail

        VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
        ARCH="$(dpkg --print-architecture)"

        dpkg-deb \
          --build \
          --root-owner-group \
          package \
          "innoextract_${VERSION}_${ARCH}.deb"

    - name: Inspect Debian package
      run: |
        echo "========================================"
        echo "Package information"
        echo "========================================"

        dpkg-deb --info innoextract_*.deb

        echo
        echo "========================================"
        echo "Package contents"
        echo "========================================"

        dpkg-deb --contents innoextract_*.deb

    - name: Test Debian package in clean Ubuntu
      shell: bash
      run: |
        set -euo pipefail

        docker run --rm \
          -v "${PWD}:/work" \
          ubuntu:latest \
          bash -c '
            set -e

            export DEBIAN_FRONTEND=noninteractive

            echo "========================================"
            echo "Clean Ubuntu environment"
            echo "========================================"

            cat /etc/os-release

            echo
            echo "========================================"
            echo "Installing minimal test dependencies"
            echo "========================================"

            apt-get update
            apt-get install -y ca-certificates

            echo
            echo "========================================"
            echo "Installing innoextract"
            echo "========================================"

            apt-get install -y /work/innoextract_*.deb

            echo
            echo "========================================"
            echo "Installed binary"
            echo "========================================"

            command -v innoextract
            ls -l /usr/bin/innoextract

            echo
            echo "========================================"
            echo "Checking runtime dependencies"
            echo "========================================"

            ldd /usr/bin/innoextract

            echo
            echo "========================================"
            echo "Checking for missing libraries"
            echo "========================================"

            if ldd /usr/bin/innoextract | grep -q "not found"; then
              echo
              echo "ERROR: Missing runtime libraries!"
              echo
              ldd /usr/bin/innoextract
              exit 1
            fi

            echo "All runtime libraries found."

            echo
            echo "========================================"
            echo "Testing innoextract"
            echo "========================================"

            innoextract --debug --help

            echo
            echo "========================================"
            echo "SUCCESS"
            echo "========================================"
          '

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: innoextract-debian-amd64
        path: innoextract_*.deb
        if-no-files-found: error
