name: CI

on:
  push:
    branches:
      - master
      - build-deb
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

jobs:
  debian10:
    name: Debian 10 Debug build
    runs-on: ubuntu-latest

    container:
      image: debian:10

    env:
      DEBIAN_FRONTEND: noninteractive
      DEBUG: "on"
      DEBUG_EXTRA: "on"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Environment"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          echo
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

      - name: Configure Debian 10 repositories
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF

          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          EOF

          apt-get update

      - name: Install build dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            ca-certificates \
            xz-utils \
            pkg-config \
            file \
            patchelf \
            dpkg-dev \
            fakeroot \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev

      - name: Prepare output directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Prepare output directory"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/ci-output"
          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          ls -la "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Boost 1.83
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Boost 1.83"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_UNDERSCORE="1_83_0"
          BOOST_PREFIX="/opt/boost"

          cd /tmp

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o "boost_${BOOST_UNDERSCORE}.tar.gz" \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"

          tar -xzf "boost_${BOOST_UNDERSCORE}.tar.gz"

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix="${BOOST_PREFIX}" \
            --with-libraries=system,filesystem,iostreams,program_options,date_time

          ./b2 \
            -j"$(nproc)" \
            variant=release \
            link=shared \
            threading=multi \
            install

          echo
          echo "========================================"
          echo "Installed Boost libraries"
          echo "========================================"

          find "${BOOST_PREFIX}/lib" \
            -maxdepth 1 \
            \( -name 'libboost_system.so*' \
               -o -name 'libboost_filesystem.so*' \
               -o -name 'libboost_iostreams.so*' \
               -o -name 'libboost_program_options.so*' \
               -o -name 'libboost_date_time.so*' \) \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Verify required Boost libraries"
          echo "========================================"

          test -f "${BOOST_PREFIX}/lib/libboost_system.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_filesystem.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_iostreams.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_program_options.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_date_time.so.1.83.0"

          echo "All required Boost libraries exist."

      - name: Configure CMake
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure CMake"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/build"

          cmake \
            -S "${GITHUB_WORKSPACE}" \
            -B "${GITHUB_WORKSPACE}/build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONTINUOUS_INTEGRATION=1 \
            -DBOOST_ROOT=/opt/boost \
            -DBOOST_LIBRARYDIR=/opt/boost/lib \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --parallel "$(nproc)"

      - name: Run tests
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Run tests"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --target check

      - name: Verify debug build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify debug build"
          echo "========================================"

          BINARY="${GITHUB_WORKSPACE}/build/innoextract"

          test -x "${BINARY}"

          echo "Binary:"
          file "${BINARY}"

          echo
          echo "Runtime dependencies:"
          ldd "${BINARY}"

      - name: Create Debian package directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create Debian package directory"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          INSTALL_ROOT="${PACKAGE_ROOT}/usr"
          LIB_ROOT="${INSTALL_ROOT}/lib/innoextract"

          rm -rf "${PACKAGE_ROOT}"

          mkdir -p \
            "${INSTALL_ROOT}/bin" \
            "${LIB_ROOT}" \
            "${PACKAGE_ROOT}/DEBIAN"

          cp \
            "${GITHUB_WORKSPACE}/build/innoextract" \
            "${INSTALL_ROOT}/bin/innoextract"

      - name: Bundle runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle runtime libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          copy_library() {
            local library="$1"

            if [ ! -f "${library}" ]; then
              echo
              echo "ERROR: Runtime library does not exist:"
              echo "${library}"
              exit 1
            fi

            echo "Bundling:"
            echo "  ${library}"

            cp -L "${library}" "${LIB_ROOT}/"
          }

          copy_library \
            "/opt/boost/lib/libboost_system.so.1.83.0"

          copy_library \
            "/opt/boost/lib/libboost_filesystem.so.1.83.0"

          copy_library \
            "/opt/boost/lib/libboost_iostreams.so.1.83.0"

          copy_library \
            "/opt/boost/lib/libboost_program_options.so.1.83.0"

          copy_library \
            "/opt/boost/lib/libboost_date_time.so.1.83.0"

          LZMA_LIBRARY="$(
            ldconfig -p |
              awk '/liblzma.so.5 / {print $NF; exit}'
          )"

          if [ -z "${LZMA_LIBRARY}" ]; then
            echo "ERROR: Could not find liblzma.so.5"
            exit 1
          fi

          copy_library "${LZMA_LIBRARY}"

          echo
          echo "Bundled libraries:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Bundle compiler runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle compiler runtime libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          copy_library() {
            local library="$1"

            if [ ! -f "${library}" ]; then
              echo
              echo "ERROR: Runtime library does not exist:"
              echo "${library}"
              exit 1
            fi

            echo "Bundling:"
            echo "  ${library}"

            cp -L "${library}" "${LIB_ROOT}/"
          }

          LIBSTDCPP="$(
            g++ -print-file-name=libstdc++.so.6
          )"

          LIBGCC="$(
            gcc -print-file-name=libgcc_s.so.1
          )"

          copy_library "${LIBSTDCPP}"
          copy_library "${LIBGCC}"

          echo
          echo "Compiler runtime libraries bundled."

      - name: Set RPATH
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          patchelf \
            --set-rpath '$ORIGIN/../lib/innoextract' \
            "${BINARY}"

          echo "RPATH:"
          patchelf --print-rpath "${BINARY}"

      - name: Create package metadata
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create package metadata"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: innoextract
          Description: Extract files from Inno Setup installers
           Debug build of innoextract with bundled runtime dependencies.
          EOF

          echo "Package version: ${VERSION}"

      - name: Build Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          PACKAGE="${GITHUB_WORKSPACE}/ci-output/innoextract_${VERSION}_amd64.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PACKAGE_ROOT}" \
            "${PACKAGE}"

          echo
          echo "Created package:"
          ls -lh "${PACKAGE}"

      - name: Inspect Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Inspect Debian package"
          echo "========================================"

          PACKAGE="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )"

          if [ -z "${PACKAGE}" ]; then
            echo "ERROR: No Debian package found."
            find "${GITHUB_WORKSPACE}/ci-output" -maxdepth 2 -ls
            exit 1
          fi

          echo
          echo "Package metadata:"
          dpkg-deb -I "${PACKAGE}"

          echo
          echo "Package contents:"
          dpkg-deb -c "${PACKAGE}"

      - name: Test package without installing dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Test package without external dependencies"
          echo "========================================"

          PACKAGE="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )"

          TEST_ROOT="/tmp/innoextract-test"

          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}"

          dpkg-deb \
            --extract \
            "${PACKAGE}" \
            "${TEST_ROOT}"

          BINARY="${TEST_ROOT}/usr/bin/innoextract"

          echo
          echo "RPATH:"
          patchelf --print-rpath "${BINARY}"

          echo
          echo "Runtime dependencies:"
          ldd "${BINARY}"

          if ldd "${BINARY}" | grep -q "not found"; then
            echo
            echo "ERROR: Missing runtime library."
            exit 1
          fi

          echo
          echo "All runtime libraries found."

          echo
          echo "Binary test:"
          "${BINARY}" --help >/dev/null

          echo "Packaged binary works."

      - name: Final artifact check
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final artifact check"
          echo "========================================"

          echo "Output directory:"
          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Files:"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          COUNT="$(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              | wc -l
          )"

          if [ "${COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${COUNT}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          echo
          echo "Exactly one Debian package found."

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          retention-days: 30
