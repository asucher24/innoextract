name: CI

on:
  push:
    branches:
      - master
      - build-deb
  pull_request:
    branches:
      - master
  schedule:
    - cron: "21 11 * * 5"

jobs:
  debian10:
    name: Debian 10 Debug build
    runs-on: ubuntu-latest

    container:
      image: debian:10

    env:
      DEBIAN_FRONTEND: noninteractive
      DEBUG: "on"
      DEBUG_EXTRA: "on"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Environment"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "Architecture:"
          dpkg --print-architecture

          echo
          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          echo
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

      - name: Configure Debian 10 repositories
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF

          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          EOF

          apt-get update

      - name: Install build dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            ca-certificates \
            xz-utils \
            pkg-config \
            file \
            patchelf \
            dpkg-dev \
            fakeroot \
            binutils \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev

      - name: Verify build toolchain
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify build toolchain"
          echo "========================================"

          echo
          echo "GCC:"
          gcc --version | head -n 1

          echo
          echo "G++:"
          g++ --version | head -n 1

          echo
          echo "CMake:"
          cmake --version | head -n 1

          echo
          echo "Make:"
          make --version | head -n 1

          echo
          echo "Pkg-config:"
          pkg-config --version

          echo
          echo "Architecture:"
          dpkg --print-architecture

          echo
          echo "glibc:"
          ldd --version | head -n 1

      - name: Prepare output directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Prepare output directory"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/ci-output"

          mkdir -p "${GITHUB_WORKSPACE}/ci-output"

          ls -lah "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Boost 1.83
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Boost 1.83"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_UNDERSCORE="1_83_0"
          BOOST_PREFIX="/opt/boost"

          cd /tmp

          rm -rf \
            "boost_${BOOST_UNDERSCORE}" \
            "boost_${BOOST_UNDERSCORE}.tar.gz"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o "boost_${BOOST_UNDERSCORE}.tar.gz" \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"

          tar \
            -xzf \
            "boost_${BOOST_UNDERSCORE}.tar.gz"

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix="${BOOST_PREFIX}" \
            --with-libraries=system,filesystem,iostreams,program_options,date_time,atomic

          ./b2 \
            -j"$(nproc)" \
            variant=release \
            link=shared \
            threading=multi \
            install

          echo
          echo "========================================"
          echo "Installed Boost libraries"
          echo "========================================"

          find "${BOOST_PREFIX}/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Verify Boost libraries"
          echo "========================================"

          test -f "${BOOST_PREFIX}/lib/libboost_system.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_filesystem.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_iostreams.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_program_options.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_date_time.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_atomic.so.1.83.0"

          echo "All required Boost libraries exist."

      - name: Configure CMake
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure CMake"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/build"

          cmake \
            -S "${GITHUB_WORKSPACE}" \
            -B "${GITHUB_WORKSPACE}/build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONTINUOUS_INTEGRATION=1 \
            -DBOOST_ROOT=/opt/boost \
            -DBOOST_LIBRARYDIR=/opt/boost/lib \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --parallel "$(nproc)"

      - name: Run tests
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Run tests"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --target check

      - name: Verify debug build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify debug build"
          echo "========================================"

          BINARY="${GITHUB_WORKSPACE}/build/innoextract"

          test -x "${BINARY}"

          echo
          echo "Binary:"
          file "${BINARY}"

          echo
          echo "Debug sections:"
          readelf -S "${BINARY}" | grep -E '\.debug_|\.symtab' || true

          echo
          echo "Build type:"
          grep -R "CMAKE_BUILD_TYPE:STRING=Debug" \
            "${GITHUB_WORKSPACE}/build/CMakeCache.txt"

          echo
          echo "Runtime dependencies:"
          ldd "${BINARY}"

      - name: Create Debian package directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create Debian package directory"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"

          rm -rf "${PACKAGE_ROOT}"

          mkdir -p \
            "${PACKAGE_ROOT}/usr/bin" \
            "${PACKAGE_ROOT}/usr/lib/innoextract" \
            "${PACKAGE_ROOT}/DEBIAN"

          cp \
            "${GITHUB_WORKSPACE}/build/innoextract" \
            "${PACKAGE_ROOT}/usr/bin/innoextract"

          chmod 0755 \
            "${PACKAGE_ROOT}/usr/bin/innoextract"

      - name: Bundle runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle runtime libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          mkdir -p "${LIB_ROOT}"

          declare -A SEEN

          is_system_core_library() {
            local library="$1"

            case "${library}" in
              /lib/*/ld-linux*.so.*)
                return 0
                ;;
              /lib/*/libc.so.*)
                return 0
                ;;
              /lib/*/libm.so.*)
                return 0
                ;;
              /lib/*/libpthread.so.*)
                return 0
                ;;
              /lib/*/librt.so.*)
                return 0
                ;;
              /lib/*/libdl.so.*)
                return 0
                ;;
              /lib/*/libresolv.so.*)
                return 0
                ;;
              /lib/*/libnss_*.so.*)
                return 0
                ;;
              /lib/*/libutil.so.*)
                return 0
                ;;
              /lib/*/libcrypt.so.*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          resolve_library() {
            local library="$1"

            if [ -f "${library}" ]; then
              readlink -f "${library}"
              return 0
            fi

            local resolved

            resolved="$(
              ldconfig -p 2>/dev/null |
                awk -v name="${library}" '
                  $1 == name {
                    print $NF
                    exit
                  }
                '
            )"

            if [ -n "${resolved}" ] && [ -f "${resolved}" ]; then
              readlink -f "${resolved}"
              return 0
            fi

            return 1
          }

          bundle_library() {
            local library="$1"

            if [ -z "${library}" ]; then
              return 0
            fi

            if [ ! -f "${library}" ]; then
              echo
              echo "ERROR: Library does not exist:"
              echo "  ${library}"
              return 1
            fi

            library="$(readlink -f "${library}")"

            if is_system_core_library "${library}"; then
              echo "Keeping system library:"
              echo "  ${library}"
              return 0
            fi

            if [ "${SEEN[${library}]+yes}" = "yes" ]; then
              return 0
            fi

            SEEN["${library}"]=1

            local basename
            basename="$(basename "${library}")"

            echo "Bundling:"
            echo "  ${library}"

            cp -L \
              "${library}" \
              "${LIB_ROOT}/${basename}"

            local dependency
            local dependency_path

            while IFS= read -r dependency; do
              dependency_path="${dependency#*=> }"

              case "${dependency_path}" in
                "not found")
                  echo
                  echo "ERROR: Dependency is missing:"
                  echo "  ${dependency}"
                  return 1
                  ;;
              esac

              case "${dependency_path}" in
                /*)
                  dependency_path="${dependency_path%% *}"

                  if [ -f "${dependency_path}" ]; then
                    bundle_library "${dependency_path}"
                  fi
                  ;;
              esac
            done < <(
              ldd "${library}" 2>/dev/null |
                sed -n 's/^[[:space:]]*\([^[:space:]]*\)[[:space:]]*=>[[:space:]]*\(.*\)$/\1 => \2/p'
            )

            return 0
          }

          echo
          echo "========================================"
          echo "Inspect executable dependencies"
          echo "========================================"

          ldd "${BINARY}"

          echo
          echo "========================================"
          echo "Bundle complete dependency closure"
          echo "========================================"

          bundle_library "${BINARY}"

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"

          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Bundled library count:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            | wc -l

      - name: Set RPATH
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Set RPATH"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          patchelf \
            --set-rpath '$ORIGIN/../lib/innoextract' \
            "${BINARY}"

          echo
          echo "RPATH:"
          patchelf --print-rpath "${BINARY}"

      - name: Verify packaged binary dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify packaged binary dependencies"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"

          echo
          echo "RPATH:"
          patchelf --print-rpath "${BINARY}"

          test \
            "$(patchelf --print-rpath "${BINARY}")" \
            = '$ORIGIN/../lib/innoextract'

          echo
          echo "Bundled libraries:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Dependencies:"
          DEPENDENCIES="$(ldd "${BINARY}")"

          printf '%s\n' "${DEPENDENCIES}"

          if printf '%s\n' "${DEPENDENCIES}" | grep -q "not found"; then
            echo
            echo "ERROR: Packaged binary has missing runtime dependencies."
            exit 1
          fi

          echo
          echo "No unresolved runtime dependencies."

      - name: Create package metadata
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create package metadata"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"

          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: innoextract
          Description: Extract files from Inno Setup installers
           Debug build of innoextract with bundled runtime dependencies.
          EOF

          echo "Package version:"
          echo "${VERSION}"

      - name: Build Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"

          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          PACKAGE="${GITHUB_WORKSPACE}/ci-output/innoextract_${VERSION}_amd64.deb"

          rm -f "${GITHUB_WORKSPACE}/ci-output/"*.deb

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PACKAGE_ROOT}" \
            "${PACKAGE}"

          test -f "${PACKAGE}"

          echo
          echo "Created package:"
          ls -lh "${PACKAGE}"

      - name: Inspect Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Inspect Debian package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo
          echo "Package:"
          echo "${PACKAGE}"

          echo
          echo "Package metadata:"
          dpkg-deb -I "${PACKAGE}"

          echo
          echo "Package contents:"
          dpkg-deb -c "${PACKAGE}"

      - name: Test extracted package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Test extracted package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Debian package."
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          TEST_ROOT="/tmp/innoextract-test"

          rm -rf "${TEST_ROOT}"

          mkdir -p "${TEST_ROOT}"

          dpkg-deb \
            --extract \
            "${PACKAGE}" \
            "${TEST_ROOT}"

          BINARY="${TEST_ROOT}/usr/bin/innoextract"
          LIB_ROOT="${TEST_ROOT}/usr/lib/innoextract"

          test -x "${BINARY}"

          echo
          echo "========================================"
          echo "Package RPATH"
          echo "========================================"

          patchelf --print-rpath "${BINARY}"

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"

          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          DEPENDENCIES="$(ldd "${BINARY}")"

          printf '%s\n' "${DEPENDENCIES}"

          if printf '%s\n' "${DEPENDENCIES}" | grep -q "not found"; then
            echo
            echo "ERROR: Extracted package has missing runtime dependencies."
            exit 1
          fi

          echo
          echo "All runtime dependencies are resolvable."

      - name: Test debug invocation
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Test --debug invocation"
          echo "========================================"

          TEST_ROOT="/tmp/innoextract-test"
          BINARY="${TEST_ROOT}/usr/bin/innoextract"

          test -x "${BINARY}"

          echo
          echo "Binary:"
          file "${BINARY}"

          echo
          echo "Debug sections:"
          readelf -S "${BINARY}" |
            grep -E '\.debug_|\.symtab' || true

          echo
          echo "Running:"
          echo "  ${BINARY} --debug"

          set +e

          OUTPUT="$(
            "${BINARY}" --debug 2>&1
          )"

          STATUS=$?

          set -e

          printf '%s\n' "${OUTPUT}"

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "ERROR: innoextract --debug failed."
            echo "Exit code: ${STATUS}"
            exit "${STATUS}"
          fi

          echo
          echo "innoextract --debug succeeded."

      - name: Final artifact check
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final artifact check"
          echo "========================================"

          echo
          echo "Output directory:"
          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Files:"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          test -s "${PACKAGE}"

          echo
          echo "Exactly one Debian package found:"
          echo "${PACKAGE}"

          echo
          echo "Package size:"
          du -h "${PACKAGE}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          retention-days: 30
