name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: on
  DEBUG_EXTRA: on

jobs:

  linux:
    name: Linux build
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Update
      run: sudo apt-get update

    - name: Dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          liblzma-dev

    - name: Configure
      run: |
        cmake \
          -B "${{ github.workspace }}/build" \
          -Werror=dev \
          -Werror=deprecated \
          -DCONTINUOUS_INTEGRATION=1

    - name: Build
      run: |
        cmake \
          --build "${{ github.workspace }}/build" \
          --parallel

    - name: Check Style
      run: |
        cmake \
          --build "${{ github.workspace }}/build" \
          --target style

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: innoextract-binary
        path: ${{ github.workspace }}/build/innoextract


  package:
    name: Debian package
    runs-on: ubuntu-latest
    needs: linux

    steps:
    - uses: actions/checkout@v4

    - name: Download binary
      uses: actions/download-artifact@v4
      with:
        name: innoextract-binary
        path: build

    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          dpkg-dev \
          patchelf \
          file \
          binutils

    - name: Show binary dependencies
      run: |
        file build/innoextract
        echo
        echo "Dependencies:"
        ldd build/innoextract

    - name: Prepare package
      shell: bash
      run: |
        set -euo pipefail

        PKGROOT="${PWD}/package"
        LIBDIR="${PKGROOT}/usr/lib/innoextract"

        rm -rf "$PKGROOT"

        mkdir -p \
          "${PKGROOT}/DEBIAN" \
          "${PKGROOT}/usr/bin" \
          "$LIBDIR"

        cp build/innoextract \
          "${PKGROOT}/usr/bin/innoextract"

        chmod 0755 \
          "${PKGROOT}/usr/bin/innoextract"

        echo "Collecting runtime libraries..."

        ldd build/innoextract

        ldd build/innoextract |
          awk '/=> \// { print $3 }' |
          sort -u > /tmp/dependencies.txt

        echo
        echo "Libraries to inspect:"
        cat /tmp/dependencies.txt

        while read -r LIB; do

          case "$LIB" in

            # Do NOT bundle glibc.
            /lib/x86_64-linux-gnu/libc.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib/x86_64-linux-gnu/libm.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib/x86_64-linux-gnu/libdl.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib/x86_64-linux-gnu/libpthread.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib/x86_64-linux-gnu/librt.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib/x86_64-linux-gnu/libgcc_s.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib/x86_64-linux-gnu/libstdc++.so.*)
              echo "System library, not bundling: $LIB"
              ;;

            /lib64/ld-linux-x86-64.so.*)
              echo "Dynamic loader, not bundling: $LIB"
              ;;

            *)
              echo "Bundling: $LIB"
              cp -L "$LIB" "$LIBDIR/"
              ;;

          esac

        done < /tmp/dependencies.txt

        echo
        echo "Bundled libraries:"
        ls -lah "$LIBDIR"

        echo
        echo "Setting RPATH..."

        patchelf \
          --set-rpath /usr/lib/innoextract \
          "${PKGROOT}/usr/bin/innoextract"

        echo
        echo "RPATH:"
        patchelf \
          --print-rpath \
          "${PKGROOT}/usr/bin/innoextract"

    - name: Create Debian control file
      shell: bash
      run: |
        set -euo pipefail

        VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

        cat > package/DEBIAN/control <<EOF
        Package: innoextract
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: innoextract CI
        Description: Tool for extracting Inno Setup installers
         innoextract extracts files from installers created by Inno Setup.
        EOF

    - name: Build Debian package
      shell: bash
      run: |
        set -euo pipefail

        VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

        dpkg-deb \
          --build \
          --root-owner-group \
          package \
          "innoextract_${VERSION}_amd64.deb"

    - name: Inspect Debian package
      run: |
        echo "Package information:"
        dpkg-deb --info innoextract_*.deb

        echo
        echo "Package contents:"
        dpkg-deb --contents innoextract_*.deb

    - name: Test package in clean Ubuntu
      run: |
        docker run --rm \
          -v "${PWD}:/work" \
          ubuntu:22.04 \
          bash -c '
            set -e

            apt-get update
            apt-get install -y ca-certificates

            echo "Installing innoextract package..."
            apt-get install -y /work/innoextract_*.deb

            echo
            echo "Installed binary:"
            command -v innoextract

            echo
            echo "Checking dependencies:"
            ldd /usr/bin/innoextract

            echo
            echo "Testing innoextract:"
            innoextract --debug --help
          '

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: innoextract-debian-amd64
        path: innoextract_*.deb
