name: CI

on:
  push:
    branches:
      - master
      - build-deb
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

jobs:
  debian10:
    name: Debian 10 Debug build
    runs-on: ubuntu-latest

    container:
      image: debian:10

    env:
      DEBIAN_FRONTEND: noninteractive
      DEBUG: "on"
      DEBUG_EXTRA: "on"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Environment"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "DEBUG=${DEBUG}"
          echo "DEBUG_EXTRA=${DEBUG_EXTRA}"

          echo
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

          echo
          echo "Architecture:"
          dpkg --print-architecture

      - name: Configure Debian 10 repositories
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure Debian 10 repositories"
          echo "========================================"

          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF

          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          EOF

          apt-get update

      - name: Install build dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Install build dependencies"
          echo "========================================"

          apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            ca-certificates \
            xz-utils \
            pkg-config \
            file \
            patchelf \
            dpkg-dev \
            fakeroot \
            binutils \
            liblzma-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev

      - name: Prepare output directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Prepare output directory"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/ci-output"

          mkdir -p \
            "${GITHUB_WORKSPACE}/ci-output"

          ls -lah "${GITHUB_WORKSPACE}/ci-output"

      - name: Build Boost 1.83
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Boost 1.83"
          echo "========================================"

          BOOST_VERSION="1.83.0"
          BOOST_UNDERSCORE="1_83_0"
          BOOST_PREFIX="/opt/boost"

          cd /tmp

          rm -rf \
            "boost_${BOOST_UNDERSCORE}" \
            "boost_${BOOST_UNDERSCORE}.tar.gz"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o "boost_${BOOST_UNDERSCORE}.tar.gz" \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"

          tar \
            -xzf \
            "boost_${BOOST_UNDERSCORE}.tar.gz"

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh \
            --prefix="${BOOST_PREFIX}" \
            --with-libraries=atomic,system,filesystem,iostreams,program_options,date_time

          ./b2 \
            -j"$(nproc)" \
            variant=release \
            link=shared \
            threading=multi \
            install

          echo
          echo "========================================"
          echo "Installed Boost libraries"
          echo "========================================"

          find "${BOOST_PREFIX}/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libboost_*.so*' \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Verify required Boost libraries"
          echo "========================================"

          test -f "${BOOST_PREFIX}/lib/libboost_atomic.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_system.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_filesystem.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_iostreams.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_program_options.so.1.83.0"
          test -f "${BOOST_PREFIX}/lib/libboost_date_time.so.1.83.0"

          echo
          echo "All required Boost libraries exist."

      - name: Configure CMake
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configure CMake"
          echo "========================================"

          rm -rf "${GITHUB_WORKSPACE}/build"

          cmake \
            -S "${GITHUB_WORKSPACE}" \
            -B "${GITHUB_WORKSPACE}/build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONTINUOUS_INTEGRATION=1 \
            -DBOOST_ROOT=/opt/boost \
            -DBOOST_LIBRARYDIR=/opt/boost/lib \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --parallel "$(nproc)"

      - name: Run tests
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Run tests"
          echo "========================================"

          cmake \
            --build "${GITHUB_WORKSPACE}/build" \
            --target check

      - name: Verify debug build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify debug build"
          echo "========================================"

          BINARY="${GITHUB_WORKSPACE}/build/innoextract"

          test -x "${BINARY}"

          echo
          echo "Binary:"
          file "${BINARY}"

          echo
          echo "ELF information:"
          readelf -h "${BINARY}" | sed -n '1,25p'

          echo
          echo "Debug sections:"
          readelf -S "${BINARY}" | grep -E 'debug|symtab' || true

          echo
          echo "Runtime dependencies:"
          ldd "${BINARY}"

      - name: Create Debian package directory
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create Debian package directory"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          INSTALL_ROOT="${PACKAGE_ROOT}/usr"
          BIN_ROOT="${INSTALL_ROOT}/bin"
          LIB_ROOT="${INSTALL_ROOT}/lib/innoextract"
          DEBIAN_ROOT="${PACKAGE_ROOT}/DEBIAN"

          rm -rf "${PACKAGE_ROOT}"

          mkdir -p \
            "${BIN_ROOT}" \
            "${LIB_ROOT}" \
            "${DEBIAN_ROOT}"

          cp \
            "${GITHUB_WORKSPACE}/build/innoextract" \
            "${BIN_ROOT}/innoextract"

          chmod 0755 \
            "${BIN_ROOT}/innoextract"

          echo
          echo "Package root:"
          find "${PACKAGE_ROOT}" \
            -maxdepth 4 \
            -print \
            | sort

      - name: Bundle runtime libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Bundle runtime libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          mkdir -p "${LIB_ROOT}"

          declare -A COPIED

          is_system_library() {
            local library="$1"
            local base

            base="$(basename "${library}")"

            case "${base}" in
              libc.so.*)
                return 0
                ;;
              libm.so.*)
                return 0
                ;;
              libpthread.so.*)
                return 0
                ;;
              librt.so.*)
                return 0
                ;;
              libdl.so.*)
                return 0
                ;;
              libutil.so.*)
                return 0
                ;;
              libresolv.so.*)
                return 0
                ;;
              libnsl.so.*)
                return 0
                ;;
              libcrypt.so.*)
                return 0
                ;;
              ld-linux*.so.*)
                return 0
                ;;
              linux-vdso.so.*)
                return 0
                ;;
            esac

            return 1
          }

          resolve_library() {
            local library_name="$1"
            local resolved

            resolved="$(
              ldconfig -p 2>/dev/null |
                awk -v name="${library_name}" '
                  $1 == name {
                    print $NF
                    exit
                  }
                '
            )"

            if [ -n "${resolved}" ] && [ -f "${resolved}" ]; then
              printf '%s\n' "${resolved}"
              return 0
            fi

            return 1
          }

          copy_library() {
            local library="$1"
            local real_library
            local base

            if [ -z "${library}" ]; then
              return 0
            fi

            if [ ! -f "${library}" ]; then
              echo
              echo "ERROR: Library does not exist:"
              echo "${library}"
              exit 1
            fi

            real_library="$(readlink -f "${library}")"
            base="$(basename "${real_library}")"

            if is_system_library "${real_library}"; then
              echo "System library, not bundling:"
              echo "  ${real_library}"
              return 0
            fi

            if [ "${COPIED[${real_library}]+yes}" = "yes" ]; then
              return 0
            fi

            COPIED["${real_library}"]="yes"

            echo "Bundling:"
            echo "  ${real_library}"

            cp \
              -L \
              "${real_library}" \
              "${LIB_ROOT}/${base}"

            chmod 0644 \
              "${LIB_ROOT}/${base}"

            patchelf \
              --force-rpath \
              --set-rpath '$ORIGIN' \
              "${LIB_ROOT}/${base}"
          }

          declare -a QUEUE

          QUEUE+=("${BINARY}")

          while [ "${#QUEUE[@]}" -gt 0 ]; do
            CURRENT="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")

            echo
            echo "Inspecting:"
            echo "  ${CURRENT}"

            while IFS= read -r line; do
              library_name="$(
                printf '%s\n' "${line}" |
                  sed -nE 's/^[[:space:]]*([^[:space:]]+)[[:space:]]+=>.*$/\1/p'
              )"

              library_path="$(
                printf '%s\n' "${line}" |
                  sed -nE 's/^[[:space:]]*[^[:space:]]+[[:space:]]+=>[[:space:]]+([^[:space:]]+)[[:space:]]+\(.*$/\1/p'
              )"

              if [ -z "${library_name}" ]; then
                continue
              fi

              case "${library_name}" in
                linux-vdso.so.*)
                  continue
                  ;;
              esac

              if [ -n "${library_path}" ] && [ -f "${library_path}" ]; then
                if is_system_library "${library_path}"; then
                  continue
                fi

                before_count="${#COPIED[@]}"

                copy_library "${library_path}"

                after_count="${#COPIED[@]}"

                if [ "${after_count}" -gt "${before_count}" ]; then
                  QUEUE+=("${LIB_ROOT}/$(basename "$(readlink -f "${library_path}")")")
                fi

                continue
              fi

              resolved="$(
                resolve_library "${library_name}" || true
              )"

              if [ -n "${resolved}" ]; then
                if is_system_library "${resolved}"; then
                  continue
                fi

                before_count="${#COPIED[@]}"

                copy_library "${resolved}"

                after_count="${#COPIED[@]}"

                if [ "${after_count}" -gt "${before_count}" ]; then
                  QUEUE+=("${LIB_ROOT}/$(basename "$(readlink -f "${resolved}")")")
                fi

                continue
              fi

              echo
              echo "ERROR: Could not resolve runtime library:"
              echo "  ${library_name}"
              echo
              echo "Dependency source:"
              echo "  ${CURRENT}"
              echo
              ldd "${CURRENT}" || true
              exit 1

            done < <(ldd "${CURRENT}")
          done

          echo
          echo "========================================"
          echo "Bundled libraries"
          echo "========================================"

          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Set executable RPATH
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Set executable RPATH"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          patchelf \
            --force-rpath \
            --set-rpath '$ORIGIN/../lib/innoextract' \
            "${BINARY}"

          echo
          echo "Executable RPATH:"
          patchelf --print-rpath "${BINARY}"

      - name: Verify bundled libraries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify bundled libraries"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          LIB_ROOT="${PACKAGE_ROOT}/usr/lib/innoextract"
          BINARY="${PACKAGE_ROOT}/usr/bin/innoextract"

          echo
          echo "Bundled libraries:"
          find "${LIB_ROOT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking RPATH of executable:"
          patchelf --print-rpath "${BINARY}"

          test \
            "$(patchelf --print-rpath "${BINARY}")" \
            = '$ORIGIN/../lib/innoextract'

          echo
          echo "Checking RPATH of bundled libraries:"

          while IFS= read -r library; do
            rpath="$(patchelf --print-rpath "${library}")"

            echo
            echo "$(basename "${library}")"
            echo "  RPATH: ${rpath}"

            test "${rpath}" = '$ORIGIN'
          done < <(
            find "${LIB_ROOT}" \
              -maxdepth 1 \
              -type f \
              -name '*.so*' \
              -print \
              | sort
          )

          echo
          echo "All bundled libraries have the expected RPATH."

      - name: Create package metadata
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Create package metadata"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: innoextract
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: innoextract
          Description: Extract files from Inno Setup installers
           Debug build of innoextract with bundled runtime dependencies.
          EOF

          echo
          echo "Control file:"
          cat "${PACKAGE_ROOT}/DEBIAN/control"

      - name: Build Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Debian package"
          echo "========================================"

          PACKAGE_ROOT="/tmp/innoextract-package"
          VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
          PACKAGE="${GITHUB_WORKSPACE}/ci-output/innoextract_${VERSION}_amd64.deb"

          rm -f "${GITHUB_WORKSPACE}/ci-output/"*.deb

          dpkg-deb \
            --build \
            --root-owner-group \
            "${PACKAGE_ROOT}" \
            "${PACKAGE}"

          test -f "${PACKAGE}"

          echo
          echo "Created package:"
          ls -lh "${PACKAGE}"

      - name: Inspect Debian package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Inspect Debian package"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo
          echo "Package:"
          echo "${PACKAGE}"

          echo
          echo "Package metadata:"
          dpkg-deb -I "${PACKAGE}"

          echo
          echo "Package contents:"
          dpkg-deb -c "${PACKAGE}"

      - name: Test package without external application dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Test package without external dependencies"
          echo "========================================"

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${#PACKAGES[@]}"
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"
          TEST_ROOT="/tmp/innoextract-test"

          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}"

          dpkg-deb \
            --extract \
            "${PACKAGE}" \
            "${TEST_ROOT}"

          BINARY="${TEST_ROOT}/usr/bin/innoextract"

          test -x "${BINARY}"

          echo
          echo "========================================"
          echo "Package RPATH"
          echo "========================================"

          patchelf --print-rpath "${BINARY}"

          echo
          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          ldd "${BINARY}"

          if ldd "${BINARY}" | grep -q "not found"; then
            echo
            echo "ERROR: Binary has missing runtime libraries."
            exit 1
          fi

          echo
          echo "No missing runtime libraries."

          echo
          echo "========================================"
          echo "Bundled library dependency checks"
          echo "========================================"

          while IFS= read -r library; do
            echo
            echo "Library:"
            echo "  ${library}"

            if ldd "${library}" | grep -q "not found"; then
              echo
              echo "ERROR: Bundled library has missing dependencies:"
              echo "  ${library}"
              ldd "${library}"
              exit 1
            fi

          done < <(
            find "${TEST_ROOT}/usr/lib/innoextract" \
              -maxdepth 1 \
              -type f \
              -name '*.so*' \
              -print \
              | sort
          )

          echo
          echo "All bundled libraries have their dependencies resolved."

          echo
          echo "========================================"
          echo "Binary test"
          echo "========================================"

          "${BINARY}" --help >/dev/null

          echo
          echo "Packaged binary works."

      - name: Verify package is Debug build
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify package is Debug build"
          echo "========================================"

          TEST_ROOT="/tmp/innoextract-test"
          BINARY="${TEST_ROOT}/usr/bin/innoextract"

          echo
          echo "Binary:"
          file "${BINARY}"

          echo
          echo "Debug sections:"
          readelf -S "${BINARY}" |
            grep -E 'debug|symtab'

          echo
          echo "Build type verification passed."

      - name: Final artifact check
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final artifact check"
          echo "========================================"

          echo
          echo "Output directory:"
          ls -lah "${GITHUB_WORKSPACE}/ci-output"

          echo
          echo "Files:"

          find "${GITHUB_WORKSPACE}/ci-output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          mapfile -t PACKAGES < <(
            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print
          )

          COUNT="${#PACKAGES[@]}"

          if [ "${COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one Debian package."
            echo "Found: ${COUNT}"

            find "${GITHUB_WORKSPACE}/ci-output" \
              -maxdepth 2 \
              -ls

            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo
          echo "Exactly one Debian package found:"
          echo "${PACKAGE}"

          echo
          echo "Package size:"
          ls -lh "${PACKAGE}"

          echo
          echo "Package type:"
          file "${PACKAGE}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian10-debug
          path: ${{ github.workspace }}/ci-output/*.deb
          if-no-files-found: error
          retention-days: 30
