jobs:
debian10:
name: Debian 10 Debug build
runs-on: ubuntu-latest

```
container:
  image: debian:10

env:
  DEBIAN_FRONTEND: noninteractive

  # innoextract debug configuration
  DEBUG: "ON"
  DEBUG_EXTRA: "ON"

  # Fixed dependency versions used for the reproducible build
  BOOST_VERSION: "1.83.0"
  BOOST_UNDERSCORE: "1_83_0"
  BOOST_PREFIX: "/opt/boost"

defaults:
  run:
    shell: bash

steps:
  # ------------------------------------------------------------------
  # Checkout
  # ------------------------------------------------------------------

  - name: Checkout
    uses: actions/checkout@v4

  # ------------------------------------------------------------------
  # Debian 10 / repository setup
  #
  # Debian 10 (buster) is archived now. Do not use the normal Debian
  # mirrors here.
  # ------------------------------------------------------------------

  - name: Configure Debian 10 repositories
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Configure Debian 10 repositories"
      echo "========================================"

      cat > /etc/apt/sources.list <<'EOF'
      deb http://archive.debian.org/debian buster main
      deb http://archive.debian.org/debian buster-updates main
      EOF

      cat > /etc/apt/apt.conf.d/99archive <<'EOF'
      Acquire::Check-Valid-Until "false";
      Acquire::AllowInsecureRepositories "true";
      Acquire::AllowDowngradeToInsecureRepositories "true";
      EOF

      apt-get update

  # ------------------------------------------------------------------
  # Build dependencies
  #
  # Everything required to BUILD the application is installed here.
  # Runtime dependencies are intentionally NOT installed into the
  # resulting Debian package. Instead, the application dependencies
  # are statically linked where possible.
  # ------------------------------------------------------------------

  - name: Install build dependencies
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Install build dependencies"
      echo "========================================"

      apt-get install -y \
        build-essential \
        cmake \
        git \
        curl \
        ca-certificates \
        xz-utils \
        pkg-config \
        file \
        binutils \
        dpkg-dev \
        fakeroot \
        patchelf \
        liblzma-dev \
        zlib1g-dev \
        libbz2-dev \
        libzstd-dev

  # ------------------------------------------------------------------
  # Verify the actual build environment
  #
  # This is intentionally early so a broken container/toolchain fails
  # before we spend time downloading/building Boost.
  # ------------------------------------------------------------------

  - name: Verify build environment
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Verify build environment"
      echo "========================================"

      echo
      echo "OS:"
      cat /etc/os-release

      echo
      echo "Architecture:"
      dpkg --print-architecture

      echo
      echo "GCC:"
      gcc --version | head -n 1

      echo
      echo "G++:"
      g++ --version | head -n 1

      echo
      echo "CMake:"
      cmake --version | head -n 1

      echo
      echo "Make:"
      make --version | head -n 1

      echo
      echo "glibc:"
      ldd --version | head -n 1

      test "$(dpkg --print-architecture)" = "amd64"
      command -v gcc
      command -v g++
      command -v cmake
      command -v make

  # ------------------------------------------------------------------
  # Prepare output directory
  #
  # This is inside GITHUB_WORKSPACE because that directory is what
  # actions/upload-artifact will later read.
  # ------------------------------------------------------------------

  - name: Prepare output directory
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Prepare output directory"
      echo "========================================"

      rm -rf "${GITHUB_WORKSPACE}/ci-output"

      mkdir -p "${GITHUB_WORKSPACE}/ci-output"

      echo
      echo "Output directory:"
      ls -la "${GITHUB_WORKSPACE}/ci-output"

  # ------------------------------------------------------------------
  # Build Boost statically
  #
  # IMPORTANT:
  # We intentionally build STATIC Boost libraries.
  #
  # The previous pipeline built shared Boost libraries. Boost.Filesystem
  # has a dependency on Boost.Atomic in Boost 1.83, which resulted in:
  #
  #   libboost_atomic.so.1.83.0 => not found
  #
  # Static Boost eliminates this entire class of runtime dependency.
  # ------------------------------------------------------------------

  - name: Build Boost 1.83 static
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Build Boost ${BOOST_VERSION} static"
      echo "========================================"

      cd /tmp

      rm -rf \
        "boost_${BOOST_UNDERSCORE}" \
        "boost_${BOOST_UNDERSCORE}.tar.gz"

      curl \
        --fail \
        --show-error \
        --location \
        --retry 5 \
        --retry-delay 2 \
        --connect-timeout 30 \
        --max-time 600 \
        -o "boost_${BOOST_UNDERSCORE}.tar.gz" \
        "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"

      tar \
        --extract \
        --gzip \
        --file "boost_${BOOST_UNDERSCORE}.tar.gz"

      cd "boost_${BOOST_UNDERSCORE}"

      ./bootstrap.sh \
        --prefix="${BOOST_PREFIX}" \
        --with-libraries=atomic,filesystem,iostreams,program_options,system,date_time

      ./b2 \
        -j"$(nproc)" \
        variant=release \
        link=static \
        runtime-link=shared \
        threading=multi \
        --with-atomic \
        --with-filesystem \
        --with-iostreams \
        --with-program_options \
        --with-system \
        --with-date_time \
        install

      echo
      echo "========================================"
      echo "Boost installation"
      echo "========================================"

      find "${BOOST_PREFIX}" \
        -maxdepth 3 \
        -type f \
        \( \
          -name 'libboost_atomic*.a' \
          -o -name 'libboost_filesystem*.a' \
          -o -name 'libboost_iostreams*.a' \
          -o -name 'libboost_program_options*.a' \
          -o -name 'libboost_system*.a' \
          -o -name 'libboost_date_time*.a' \
        \) \
        -print \
        | sort

      echo
      echo "========================================"
      echo "Verify static Boost libraries"
      echo "========================================"

      test -n "$(find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost_atomic*.a' -print -quit)"
      test -n "$(find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost_filesystem*.a' -print -quit)"
      test -n "$(find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost_iostreams*.a' -print -quit)"
      test -n "$(find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost_program_options*.a' -print -quit)"
      test -n "$(find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost_system*.a' -print -quit)"
      test -n "$(find "${BOOST_PREFIX}/lib" -maxdepth 1 -type f -name 'libboost_date_time*.a' -print -quit)"

      echo
      echo "All required static Boost libraries exist."

  # ------------------------------------------------------------------
  # Configure CMake
  #
  # IMPORTANT:
  #
  # CMAKE_BUILD_TYPE=Debug
  # DEBUG=ON
  # DEBUG_EXTRA=ON
  #
  # and, critically:
  #
  # USE_STATIC_LIBS=ON
  #
  # The latter enables static linking of Boost/liblzma/zlib/bzip2 and
  # the compiler runtimes according to the innoextract build system.
  # ------------------------------------------------------------------

  - name: Configure CMake
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Configure CMake"
      echo "========================================"

      rm -rf "${GITHUB_WORKSPACE}/build"

      cmake \
        -S "${GITHUB_WORKSPACE}" \
        -B "${GITHUB_WORKSPACE}/build" \
        -DCMAKE_BUILD_TYPE=Debug \
        -DDEBUG=ON \
        -DDEBUG_EXTRA=ON \
        -DCONTINUOUS_INTEGRATION=1 \
        -DBUILD_TESTS=ON \
        -DBOOST_ROOT="${BOOST_PREFIX}" \
        -DBOOST_INCLUDEDIR="${BOOST_PREFIX}/include" \
        -DBOOST_LIBRARYDIR="${BOOST_PREFIX}/lib" \
        -DBoost_USE_STATIC_LIBS=ON \
        -DBoost_USE_MULTITHREADED=ON \
        -DBoost_USE_STATIC_RUNTIME=OFF \
        -DBoost_NO_BOOST_CMAKE=ON \
        -DBoost_NO_SYSTEM_PATHS=ON \
        -DLZMA_USE_STATIC_LIBS=ON \
        -DZLIB_USE_STATIC_LIBS=ON \
        -DBZip2_USE_STATIC_LIBS=ON \
        -DUSE_STATIC_LIBS=ON

  # ------------------------------------------------------------------
  # Build
  # ------------------------------------------------------------------

  - name: Build
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Build"
      echo "========================================"

      cmake \
        --build "${GITHUB_WORKSPACE}/build" \
        --parallel "$(nproc)"

  # ------------------------------------------------------------------
  # Unit tests
  # ------------------------------------------------------------------

  - name: Run tests
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Run tests"
      echo "========================================"

      cmake \
        --build "${GITHUB_WORKSPACE}/build" \
        --target check

  # ------------------------------------------------------------------
  # Verify debug build
  #
  # This verifies:
  #   1. Binary exists
  #   2. It is an ELF executable
  #   3. DEBUG was actually compiled in
  #   4. --debug is accepted by the CLI
  # ------------------------------------------------------------------

  - name: Verify debug build
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Verify debug build"
      echo "========================================"

      BINARY="${GITHUB_WORKSPACE}/build/innoextract"

      test -x "${BINARY}"

      echo
      echo "Binary:"
      file "${BINARY}"

      echo
      echo "Build ID / debug sections:"
      readelf -S "${BINARY}" | grep -E 'debug|symtab' || true

      echo
      echo "Debug strings:"
      strings "${BINARY}" | grep -E 'with debug output|debug' | head -n 20 || true

      echo
      echo "Testing --debug:"
      "${BINARY}" --debug --help >/tmp/innoextract-debug-help.txt

      grep -q -- "--debug" /tmp/innoextract-debug-help.txt

      echo
      echo "--debug is accepted by the debug binary."

  # ------------------------------------------------------------------
  # Create package root
  #
  # No runtime libraries are manually copied here.
  #
  # The application dependencies are statically linked into the binary.
  # This is deliberately different from the previous approach, where
  # we tried to chase Boost's transitive shared-library dependencies.
  # ------------------------------------------------------------------

  - name: Create Debian package root
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Create Debian package root"
      echo "========================================"

      PACKAGE_ROOT="/tmp/innoextract-package"

      rm -rf "${PACKAGE_ROOT}"

      mkdir -p \
        "${PACKAGE_ROOT}/usr/bin" \
        "${PACKAGE_ROOT}/DEBIAN"

      cp \
        "${GITHUB_WORKSPACE}/build/innoextract" \
        "${PACKAGE_ROOT}/usr/bin/innoextract"

      chmod 0755 \
        "${PACKAGE_ROOT}/usr/bin/innoextract"

      echo
      echo "Package root:"
      find "${PACKAGE_ROOT}" \
        -maxdepth 4 \
        -print \
        | sort

  # ------------------------------------------------------------------
  # Package metadata
  # ------------------------------------------------------------------

  - name: Create Debian package metadata
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Create Debian package metadata"
      echo "========================================"

      PACKAGE_ROOT="/tmp/innoextract-package"
      VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"

      cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
      Package: innoextract
      Version: ${VERSION}
      Section: utils
      Priority: optional
      Architecture: amd64
      Maintainer: innoextract
      Description: Extract files from Inno Setup installers
       Debug build of innoextract for Debian 10 with statically linked application dependencies.
      EOF

      echo
      echo "Control file:"
      cat "${PACKAGE_ROOT}/DEBIAN/control"

  # ------------------------------------------------------------------
  # Build .deb
  # ------------------------------------------------------------------

  - name: Build Debian package
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Build Debian package"
      echo "========================================"

      PACKAGE_ROOT="/tmp/innoextract-package"
      VERSION="0.0.0+git${GITHUB_RUN_NUMBER}"
      PACKAGE="${GITHUB_WORKSPACE}/ci-output/innoextract_${VERSION}_amd64.deb"

      rm -f "${GITHUB_WORKSPACE}/ci-output/"*.deb

      dpkg-deb \
        --build \
        --root-owner-group \
        "${PACKAGE_ROOT}" \
        "${PACKAGE}"

      test -f "${PACKAGE}"

      echo
      echo "Created package:"
      ls -lh "${PACKAGE}"

  # ------------------------------------------------------------------
  # Inspect package
  # ------------------------------------------------------------------

  - name: Inspect Debian package
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Inspect Debian package"
      echo "========================================"

      PACKAGE="$(find "${GITHUB_WORKSPACE}/ci-output" -maxdepth 1 -type f -name '*.deb' -print -quit)"

      test -n "${PACKAGE}"
      test -f "${PACKAGE}"

      echo
      echo "Package:"
      echo "${PACKAGE}"

      echo
      echo "Package metadata:"
      dpkg-deb --info "${PACKAGE}"

      echo
      echo "Package contents:"
      dpkg-deb --contents "${PACKAGE}"

  # ------------------------------------------------------------------
  # Verify the packaged binary.
  #
  # We extract the actual .deb and test THAT binary.
  #
  # This is important: testing build/innoextract is insufficient because
  # packaging can alter RPATH, files, permissions, etc.
  # ------------------------------------------------------------------

  - name: Verify packaged binary
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Verify packaged binary"
      echo "========================================"

      PACKAGE="$(find "${GITHUB_WORKSPACE}/ci-output" -maxdepth 1 -type f -name '*.deb' -print -quit)"
      TEST_ROOT="/tmp/innoextract-test"

      test -n "${PACKAGE}"
      test -f "${PACKAGE}"

      rm -rf "${TEST_ROOT}"
      mkdir -p "${TEST_ROOT}"

      dpkg-deb \
        --extract \
        "${PACKAGE}" \
        "${TEST_ROOT}"

      BINARY="${TEST_ROOT}/usr/bin/innoextract"

      test -x "${BINARY}"

      echo
      echo "Packaged binary:"
      file "${BINARY}"

      echo
      echo "RPATH:"
      patchelf --print-rpath "${BINARY}" || true

      echo
      echo "Runtime dependencies:"
      ldd "${BINARY}"

      echo
      echo "Checking for missing dependencies..."

      if ldd "${BINARY}" | grep -q "not found"; then
        echo
        echo "ERROR: Packaged binary has missing runtime dependencies."
        exit 1
      fi

      echo
      echo "No missing runtime dependencies."

  # ------------------------------------------------------------------
  # Strong dependency verification
  #
  # The package must NOT depend on Boost shared libraries or compiler
  # runtimes.
  #
  # System glibc libraries are expected and deliberately remain system
  # dependencies.
  # ------------------------------------------------------------------

  - name: Verify dependency portability
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Verify dependency portability"
      echo "========================================"

      PACKAGE="$(find "${GITHUB_WORKSPACE}/ci-output" -maxdepth 1 -type f -name '*.deb' -print -quit)"
      TEST_ROOT="/tmp/innoextract-test"
      BINARY="${TEST_ROOT}/usr/bin/innoextract"

      test -n "${PACKAGE}"
      test -x "${BINARY}"

      DEPS="$(ldd "${BINARY}")"

      echo
      echo "All dynamic dependencies:"
      echo "${DEPS}"

      echo
      echo "Checking for Boost shared libraries..."

      if echo "${DEPS}" | grep -E -q 'libboost_[A-Za-z0-9_]+\.so'; then
        echo
        echo "ERROR: Binary still has a dynamic Boost dependency."
        echo "${DEPS}"
        exit 1
      fi

      echo "No dynamic Boost libraries."

      echo
      echo "Checking for dynamic libstdc++..."

      if echo "${DEPS}" | grep -q 'libstdc++\.so'; then
        echo
        echo "ERROR: Binary still has a dynamic libstdc++ dependency."
        echo "${DEPS}"
        exit 1
      fi

      echo "No dynamic libstdc++ dependency."

      echo
      echo "Checking for dynamic libgcc_s..."

      if echo "${DEPS}" | grep -q 'libgcc_s\.so'; then
        echo
        echo "ERROR: Binary still has a dynamic libgcc_s dependency."
        echo "${DEPS}"
        exit 1
      fi

      echo "No dynamic libgcc_s dependency."

      echo
      echo "Application dependencies are statically linked."

  # ------------------------------------------------------------------
  # Verify --debug on the ACTUAL packaged binary
  # ------------------------------------------------------------------

  - name: Test packaged binary with --debug
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Test packaged binary with --debug"
      echo "========================================"

      TEST_ROOT="/tmp/innoextract-test"
      BINARY="${TEST_ROOT}/usr/bin/innoextract"

      test -x "${BINARY}"

      echo
      echo "Running:"
      echo "  ${BINARY} --debug --help"

      "${BINARY}" --debug --help > /tmp/innoextract-packaged-help.txt

      echo
      echo "Help output:"
      cat /tmp/innoextract-packaged-help.txt

      echo
      echo "Checking that --debug is present..."

      grep -q -- "--debug" /tmp/innoextract-packaged-help.txt

      echo
      echo "SUCCESS: packaged debug binary accepts --debug."

  # ------------------------------------------------------------------
  # Verify package structure and architecture
  # ------------------------------------------------------------------

  - name: Final package verification
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Final package verification"
      echo "========================================"

      OUTPUT="${GITHUB_WORKSPACE}/ci-output"

      echo
      echo "Output directory:"
      ls -lah "${OUTPUT}"

      echo
      echo "Files:"
      find "${OUTPUT}" \
        -maxdepth 1 \
        -type f \
        -printf '%f\n' \
        | sort

      COUNT="$(
        find "${OUTPUT}" \
          -maxdepth 1 \
          -type f \
          -name '*.deb' \
          | wc -l
      )"

      if [ "${COUNT}" -ne 1 ]; then
        echo
        echo "ERROR: Expected exactly one Debian package."
        echo "Found: ${COUNT}"

        find "${OUTPUT}" \
          -maxdepth 2 \
          -ls

        exit 1
      fi

      PACKAGE="$(
        find "${OUTPUT}" \
          -maxdepth 1 \
          -type f \
          -name '*.deb' \
          -print
      )"

      ARCH="$(dpkg-deb --field "${PACKAGE}" Architecture)"
      PACKAGE_NAME="$(dpkg-deb --field "${PACKAGE}" Package)"
      PACKAGE_VERSION="$(dpkg-deb --field "${PACKAGE}" Version)"

      echo
      echo "Package name:    ${PACKAGE_NAME}"
      echo "Package version: ${PACKAGE_VERSION}"
      echo "Package arch:    ${ARCH}"

      test "${PACKAGE_NAME}" = "innoextract"
      test "${ARCH}" = "amd64"

      echo
      echo "Package verification successful."

  # ------------------------------------------------------------------
  # Upload the actual .deb
  # ------------------------------------------------------------------

  - name: Upload Debian package
    uses: actions/upload-artifact@v4
    with:
      name: innoextract-debian10-debug
      path: ${{ github.workspace }}/ci-output/*.deb
      if-no-files-found: error
      retention-days: 30
