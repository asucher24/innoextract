name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: "on"
  DEBUG_EXTRA: "on"

jobs:

  linux:
    name: Debian 10 build and package
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          set -euo pipefail
          rm -rf ci-output
          mkdir -p ci-output

      - name: Build Debian 10 package
        env:
          DEBUG: "on"
          DEBUG_EXTRA: "on"
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -e DEBUG="${DEBUG}" \
            -e DEBUG_EXTRA="${DEBUG_EXTRA}" \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${PWD}:/src" \
            -w /src \
            debian:10 \
            bash -euxo pipefail -c "

              export DEBIAN_FRONTEND=noninteractive

              echo '========================================'
              echo 'Debian version'
              echo '========================================'

              cat /etc/os-release

              echo
              echo '========================================'
              echo 'Configure Debian 10 repositories'
              echo '========================================'

              printf '%s\n' \
                'deb http://archive.debian.org/debian buster main contrib non-free' \
                'deb http://archive.debian.org/debian-security buster/updates main contrib non-free' \
                > /etc/apt/sources.list

              printf '%s\n' \
                'Acquire::Check-Valid-Until \"false\";' \
                > /etc/apt/apt.conf.d/99archive

              apt-get update

              echo
              echo '========================================'
              echo 'Install build dependencies'
              echo '========================================'

              apt-get install -y \
                build-essential \
                cmake \
                git \
                wget \
                ca-certificates \
                xz-utils \
                bzip2 \
                tar \
                dpkg-dev \
                file \
                patchelf \
                pax-utils \
                pkg-config \
                liblzma-dev \
                zlib1g-dev \
                libbz2-dev

              echo
              echo '========================================'
              echo 'Toolchain'
              echo '========================================'

              cmake --version
              gcc --version
              g++ --version
              dpkg --version

              echo
              echo \"DEBUG=\${DEBUG}\"
              echo \"DEBUG_EXTRA=\${DEBUG_EXTRA}\"

              echo
              echo '========================================'
              echo 'Build Boost 1.83.0'
              echo '========================================'

              BOOST_VERSION='1.83.0'
              BOOST_VERSION_UNDERSCORE='1_83_0'

              cd /tmp

              wget \
                \"https://archives.boost.io/release/\${BOOST_VERSION}/source/boost_\${BOOST_VERSION_UNDERSCORE}.tar.bz2\" \
                -O boost.tar.bz2

              tar -xjf boost.tar.bz2

              cd \"boost_\${BOOST_VERSION_UNDERSCORE}\"

              ./bootstrap.sh \
                --prefix=/opt/boost

              ./b2 \
                -j\"\$(nproc)\" \
                --prefix=/opt/boost \
                link=shared \
                runtime-link=shared \
                install

              echo
              echo '========================================'
              echo 'Installed Boost libraries'
              echo '========================================'

              find /opt/boost/lib \
                -maxdepth 1 \
                -type f \
                -name 'libboost_*.so*' \
                -print \
                | sort

              echo
              echo '========================================'
              echo 'Configure innoextract'
              echo '========================================'

              cd /src

              rm -rf build

              export BOOST_ROOT=/opt/boost
              export CMAKE_PREFIX_PATH=/opt/boost

              cmake \
                -B /src/build \
                -Werror=dev \
                -Werror=deprecated \
                -DCONTINUOUS_INTEGRATION=1 \
                -DBoost_ROOT=/opt/boost \
                -DBoost_NO_SYSTEM_PATHS=ON

              echo
              echo '========================================'
              echo 'Build innoextract'
              echo '========================================'

              cmake \
                --build /src/build \
                --parallel

              echo
              echo '========================================'
              echo 'Check style'
              echo '========================================'

              if cmake --build /src/build --target help | grep -qE '(^|[[:space:]])style([[:space:]]|$)'; then
                echo 'Style target found.'
                cmake --build /src/build --target style
              else
                echo 'No style target exists in this CMake configuration.'
                echo 'Skipping style check.'
              fi

              echo
              echo '========================================'
              echo 'Binary'
              echo '========================================'

              file /src/build/innoextract

              echo
              echo 'Runtime dependencies:'
              ldd /src/build/innoextract

              echo
              echo '========================================'
              echo 'Prepare Debian package'
              echo '========================================'

              PKGROOT=/src/package
              LIBDIR=\${PKGROOT}/usr/lib/innoextract

              rm -rf \"\${PKGROOT}\"

              mkdir -p \
                \"\${PKGROOT}/DEBIAN\" \
                \"\${PKGROOT}/usr/bin\" \
                \"\${LIBDIR}\"

              cp \
                /src/build/innoextract \
                \"\${PKGROOT}/usr/bin/innoextract\"

              chmod 0755 \
                \"\${PKGROOT}/usr/bin/innoextract\"

              echo
              echo '========================================'
              echo 'Collect required libraries'
              echo '========================================'

              ldd /src/build/innoextract

              echo
              echo '========================================'
              echo 'Copy Boost libraries'
              echo '========================================'

              find /opt/boost/lib \
                -maxdepth 1 \
                -type f \
                -name 'libboost_*.so*' \
                -exec cp -L {} \"\${LIBDIR}/\" \;

              echo
              echo '========================================'
              echo 'Copy liblzma'
              echo '========================================'

              LZMA_PATH=\$(ldconfig -p | awk '/liblzma.so.5/{print \$NF; exit}')

              if [ -z \"\${LZMA_PATH}\" ]; then
                echo 'ERROR: Could not find liblzma.so.5'
                exit 1
              fi

              echo \"liblzma: \${LZMA_PATH}\"

              cp -L \
                \"\${LZMA_PATH}\" \
                \"\${LIBDIR}/\"

              echo
              echo '========================================'
              echo 'Remove unwanted libraries'
              echo '========================================'

              rm -f \
                \"\${LIBDIR}/libstdc++.so.6\" \
                \"\${LIBDIR}/libgcc_s.so.1\" \
                \"\${LIBDIR}/libc.so.6\" \
                \"\${LIBDIR}/libm.so.6\" \
                \"\${LIBDIR}/libdl.so.2\" \
                \"\${LIBDIR}/libpthread.so.0\" \
                \"\${LIBDIR}/librt.so.1\" \
                \"\${LIBDIR}/ld-linux-x86-64.so.2\"

              echo
              echo 'Libraries inside package:'

              ls -lah \"\${LIBDIR}\"

              echo
              echo '========================================'
              echo 'Configure RPATH'
              echo '========================================'

              patchelf \
                --set-rpath /usr/lib/innoextract \
                \"\${PKGROOT}/usr/bin/innoextract\"

              patchelf \
                --print-rpath \
                \"\${PKGROOT}/usr/bin/innoextract\"

              echo
              echo '========================================'
              echo 'Verify package binary'
              echo '========================================'

              LD_LIBRARY_PATH=\"\${LIBDIR}\" \
                ldd \"\${PKGROOT}/usr/bin/innoextract\"

              echo
              echo '========================================'
              echo 'Create Debian package metadata'
              echo '========================================'

              VERSION=\"0.0.0+git\${GITHUB_RUN_NUMBER}\"
              ARCH=\$(dpkg --print-architecture)

              printf '%s\n' \
                'Package: innoextract' \
                \"Version: \${VERSION}\" \
                'Section: utils' \
                'Priority: optional' \
                \"Architecture: \${ARCH}\" \
                'Maintainer: innoextract CI' \
                'Description: Tool for extracting Inno Setup installers' \
                ' innoextract extracts files from installers created by Inno Setup.' \
                > \"\${PKGROOT}/DEBIAN/control\"

              echo
              echo '========================================'
              echo 'Build .deb'
              echo '========================================'

              dpkg-deb \
                --build \
                --root-owner-group \
                \"\${PKGROOT}\" \
                \"/src/ci-output/innoextract_\${VERSION}_\${ARCH}.deb\"

              echo
              echo '========================================'
              echo 'Package information'
              echo '========================================'

              dpkg-deb \
                --info \
                /src/ci-output/innoextract_*.deb

              echo
              echo '========================================'
              echo 'Package contents'
              echo '========================================'

              dpkg-deb \
                --contents \
                /src/ci-output/innoextract_*.deb

              echo
              echo '========================================'
              echo 'BUILD SUCCESSFUL'
              echo '========================================'
            "

      - name: Test package on clean Debian 10
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -v "${PWD}/ci-output:/work:ro" \
            debian:10 \
            bash -euxo pipefail -c "

              export DEBIAN_FRONTEND=noninteractive

              echo '========================================'
              echo 'Debian 10 test environment'
              echo '========================================'

              cat /etc/os-release

              printf '%s\n' \
                'deb http://archive.debian.org/debian buster main' \
                'deb http://archive.debian.org/debian-security buster/updates main' \
                > /etc/apt/sources.list

              printf '%s\n' \
                'Acquire::Check-Valid-Until \"false\";' \
                > /etc/apt/apt.conf.d/99archive

              apt-get update

              echo
              echo '========================================'
              echo 'Install minimal test dependencies'
              echo '========================================'

              apt-get install -y \
                ca-certificates \
                file

              echo
              echo '========================================'
              echo 'Install innoextract'
              echo '========================================'

              apt-get install -y \
                /work/innoextract_*.deb

              echo
              echo '========================================'
              echo 'Installed binary'
              echo '========================================'

              command -v innoextract

              file /usr/bin/innoextract

              echo
              echo '========================================'
              echo 'Runtime dependencies'
              echo '========================================'

              ldd /usr/bin/innoextract

              echo
              echo '========================================'
              echo 'Check missing libraries'
              echo '========================================'

              if ldd /usr/bin/innoextract | grep -q 'not found'; then
                echo 'ERROR: Missing runtime libraries'
                ldd /usr/bin/innoextract
                exit 1
              fi

              echo 'All runtime libraries found.'

              echo
              echo '========================================'
              echo 'Verify bundled Boost'
              echo '========================================'

              for LIB in \
                libboost_iostreams.so.1.83.0 \
                libboost_filesystem.so.1.83.0 \
                libboost_program_options.so.1.83.0; do

                if [ ! -f \"/usr/lib/innoextract/\${LIB}\" ]; then
                  echo \"ERROR: Missing bundled Boost library: \${LIB}\"
                  exit 1
                fi

                echo \"Found: \${LIB}\"
              done

              echo
              echo '========================================'
              echo 'Verify system libstdc++'
              echo '========================================'

              SYSTEM_STDCXX=\$(ldd /usr/bin/innoextract | awk '/libstdc\\+\\+\\.so\\.6/{print \$3; exit}')

              if [ -z \"\${SYSTEM_STDCXX}\" ]; then
                echo 'ERROR: libstdc++.so.6 was not resolved.'
                exit 1
              fi

              echo \"System libstdc++: \${SYSTEM_STDCXX}\"

              case \"\${SYSTEM_STDCXX}\" in
                /usr/lib/innoextract/*)
                  echo 'ERROR: libstdc++ must NOT be bundled.'
                  exit 1
                  ;;
              esac

              echo 'System libstdc++ is correctly used.'

              echo
              echo '========================================'
              echo 'Run innoextract'
              echo '========================================'

              innoextract --help

              echo
              echo '========================================'
              echo 'Debian 10 test successful'
              echo '========================================'
            "

      - name: Test package on Ubuntu latest
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -v "${PWD}/ci-output:/work:ro" \
            ubuntu:latest \
            bash -euxo pipefail -c "

              export DEBIAN_FRONTEND=noninteractive

              echo '========================================'
              echo 'Ubuntu test environment'
              echo '========================================'

              cat /etc/os-release

              apt-get update

              apt-get install -y \
                ca-certificates \
                file

              echo
              echo '========================================'
              echo 'Install innoextract'
              echo '========================================'

              apt-get install -y \
                /work/innoextract_*.deb

              echo
              echo '========================================'
              echo 'Runtime dependencies'
              echo '========================================'

              ldd /usr/bin/innoextract

              echo
              echo '========================================'
              echo 'Check missing libraries'
              echo '========================================'

              if ldd /usr/bin/innoextract | grep -q 'not found'; then
                echo 'ERROR: Missing runtime libraries'
                ldd /usr/bin/innoextract
                exit 1
              fi

              echo 'All runtime libraries found.'

              echo
              echo '========================================'
              echo 'Verify bundled Boost'
              echo '========================================'

              for LIB in \
                libboost_iostreams.so.1.83.0 \
                libboost_filesystem.so.1.83.0 \
                libboost_program_options.so.1.83.0; do

                if [ ! -f \"/usr/lib/innoextract/\${LIB}\" ]; then
                  echo \"ERROR: Missing bundled Boost library: \${LIB}\"
                  exit 1
                fi

                echo \"Found: \${LIB}\"
              done

              echo
              echo '========================================'
              echo 'Run innoextract'
              echo '========================================'

              innoextract --help

              echo
              echo '========================================'
              echo 'Ubuntu test successful'
              echo '========================================'
            "

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian-amd64
          path: ci-output/*.deb
          if-no-files-found: error
