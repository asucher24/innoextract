name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 11 * * 5'

env:
  DEBUG: "on"
  DEBUG_EXTRA: "on"

jobs:

  linux:
    name: Debian 10 build and package
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          set -euo pipefail
          mkdir -p ci-output

      - name: Build Debian 10 package
        env:
          DEBUG: "on"
          DEBUG_EXTRA: "on"
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -e DEBUG="${DEBUG}" \
            -e DEBUG_EXTRA="${DEBUG_EXTRA}" \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${PWD}:/src" \
            -w /src \
            debian:10 \
            bash -euxo pipefail -c "

              export DEBIAN_FRONTEND=noninteractive

              echo '========================================'
              echo 'Debian version'
              echo '========================================'

              cat /etc/os-release

              echo
              echo '========================================'
              echo 'Configure Debian 10 repositories'
              echo '========================================'

              printf '%s\n' \
                'deb http://archive.debian.org/debian buster main contrib non-free' \
                'deb http://archive.debian.org/debian-security buster/updates main contrib non-free' \
                > /etc/apt/sources.list

              printf '%s\n' \
                'Acquire::Check-Valid-Until \"false\";' \
                > /etc/apt/apt.conf.d/99archive

              apt-get update

              echo
              echo '========================================'
              echo 'Install build dependencies'
              echo '========================================'

              apt-get install -y \
                build-essential \
                cmake \
                git \
                wget \
                ca-certificates \
                xz-utils \
                bzip2 \
                tar \
                dpkg-dev \
                file \
                patchelf \
                pax-utils \
                pkg-config \
                liblzma-dev \
                zlib1g-dev \
                libbz2-dev

              echo
              echo '========================================'
              echo 'Toolchain'
              echo '========================================'

              cmake --version
              gcc --version
              g++ --version
              dpkg --version

              echo
              echo \"DEBUG=\${DEBUG}\"
              echo \"DEBUG_EXTRA=\${DEBUG_EXTRA}\"

              echo
              echo '========================================'
              echo 'Build Boost 1.83.0'
              echo '========================================'

              BOOST_VERSION='1.83.0'
              BOOST_VERSION_UNDERSCORE='1_83_0'

              cd /tmp

              wget \
                \"https://archives.boost.io/release/\${BOOST_VERSION}/source/boost_\${BOOST_VERSION_UNDERSCORE}.tar.bz2\" \
                -O boost.tar.bz2

              tar -xjf boost.tar.bz2

              cd \"boost_\${BOOST_VERSION_UNDERSCORE}\"

              ./bootstrap.sh \
                --prefix=/opt/boost

              ./b2 \
                -j\"\$(nproc)\" \
                --prefix=/opt/boost \
                link=shared \
                runtime-link=shared \
                install

              echo
              echo '========================================'
              echo 'Installed Boost libraries'
              echo '========================================'

              find /opt/boost/lib \
                -maxdepth 1 \
                -type f \
                -name 'libboost_*.so*' \
                -print \
                | sort

              echo
              echo '========================================'
              echo 'Configure innoextract'
              echo '========================================'

              cd /src

              rm -rf build

              export BOOST_ROOT=/opt/boost
              export CMAKE_PREFIX_PATH=/opt/boost

              cmake \
                -B /src/build \
                -Werror=dev \
                -Werror=deprecated \
                -DCONTINUOUS_INTEGRATION=1 \
                -DBoost_ROOT=/opt/boost \
                -DBoost_NO_SYSTEM_PATHS=ON

              echo
              echo '========================================'
              echo 'Build innoextract'
              echo '========================================'

              cmake \
                --build /src/build \
                --parallel

              echo
              echo '========================================'
              echo 'Check style'
              echo '========================================'

              cmake \
                --build /src/build \
                --target style

              echo
              echo '========================================'
              echo 'Binary'
              echo '========================================'

              file /src/build/innoextract

              echo
              echo 'Runtime dependencies:'
              ldd /src/build/innoextract

              echo
              echo '========================================'
              echo 'Prepare Debian package'
              echo '========================================'

              PKGROOT=/src/package
              LIBDIR=\${PKGROOT}/usr/lib/innoextract

              rm -rf \"\${PKGROOT}\"

              mkdir -p \
                \"\${PKGROOT}/DEBIAN\" \
                \"\${PKGROOT}/usr/bin\" \
                \"\${LIBDIR}\"

              cp \
                /src/build/innoextract \
                \"\${PKGROOT}/usr/bin/innoextract\"

              chmod 0755 \
                \"\${PKGROOT}/usr/bin/innoextract\"

              echo
              echo '========================================'
              echo 'Collect runtime libraries'
              echo '========================================'

              lddtree -l /src/build/innoextract \
                > /tmp/all-libraries.txt

              cat /tmp/all-libraries.txt

              echo
              echo '========================================'
              echo 'Bundle runtime libraries'
              echo '========================================'

              while read -r LIB; do

                if [ -z \"\${LIB}\" ]; then
                  continue
                fi

                case \"\${LIB}\" in
                  /*)
                    ;;
                  *)
                    continue
                    ;;
                esac

                BASENAME=\$(basename \"\${LIB}\")

                case \"\${BASENAME}\" in
                  ld-linux*.so*)
                    echo \"System library: \${LIB}\"
                    continue
                    ;;
                  libc.so.*)
                    echo \"System library: \${LIB}\"
                    continue
                    ;;
                  libm.so.*)
                    echo \"System library: \${LIB}\"
                    continue
                    ;;
                  libdl.so.*)
                    echo \"System library: \${LIB}\"
                    continue
                    ;;
                  libpthread.so.*)
                    echo \"System library: \${LIB}\"
                    continue
                    ;;
                  librt.so.*)
                    echo \"System library: \${LIB}\"
                    continue
                    ;;
                esac

                echo \"Bundling: \${LIB}\"

                cp -L \
                  \"\${LIB}\" \
                  \"\${LIBDIR}/\${BASENAME}\"

              done < /tmp/all-libraries.txt

              echo
              echo '========================================'
              echo 'Bundled libraries'
              echo '========================================'

              ls -lah \"\${LIBDIR}\"

              echo
              echo '========================================'
              echo 'Configure RPATH'
              echo '========================================'

              patchelf \
                --set-rpath /usr/lib/innoextract \
                \"\${PKGROOT}/usr/bin/innoextract\"

              echo
              echo 'RPATH:'

              patchelf \
                --print-rpath \
                \"\${PKGROOT}/usr/bin/innoextract\"

              echo
              echo '========================================'
              echo 'Create Debian package metadata'
              echo '========================================'

              VERSION=\"0.0.0+git\${GITHUB_RUN_NUMBER}\"
              ARCH=\$(dpkg --print-architecture)

              printf '%s\n' \
                'Package: innoextract' \
                \"Version: \${VERSION}\" \
                'Section: utils' \
                'Priority: optional' \
                \"Architecture: \${ARCH}\" \
                'Maintainer: innoextract CI' \
                'Description: Tool for extracting Inno Setup installers' \
                ' innoextract extracts files from installers created by Inno Setup.' \
                > \"\${PKGROOT}/DEBIAN/control\"

              echo
              echo '========================================'
              echo 'Build .deb'
              echo '========================================'

              dpkg-deb \
                --build \
                --root-owner-group \
                \"\${PKGROOT}\" \
                \"/src/ci-output/innoextract_\${VERSION}_\${ARCH}.deb\"

              echo
              echo '========================================'
              echo 'Package information'
              echo '========================================'

              dpkg-deb \
                --info \
                /src/ci-output/innoextract_*.deb

              echo
              echo '========================================'
              echo 'Package contents'
              echo '========================================'

              dpkg-deb \
                --contents \
                /src/ci-output/innoextract_*.deb

              echo
              echo '========================================'
              echo 'BUILD SUCCESSFUL'
              echo '========================================'
            "

      - name: Test package on Debian 10
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -v "${PWD}/ci-output:/work:ro" \
            debian:10 \
            bash -euxo pipefail -c "

              export DEBIAN_FRONTEND=noninteractive

              echo '========================================'
              echo 'Debian 10 test environment'
              echo '========================================'

              cat /etc/os-release

              printf '%s\n' \
                'deb http://archive.debian.org/debian buster main' \
                'deb http://archive.debian.org/debian-security buster/updates main' \
                > /etc/apt/sources.list

              printf '%s\n' \
                'Acquire::Check-Valid-Until \"false\";' \
                > /etc/apt/apt.conf.d/99archive

              apt-get update

              apt-get install -y \
                ca-certificates \
                file

              echo
              echo '========================================'
              echo 'Install innoextract'
              echo '========================================'

              apt-get install -y \
                /work/innoextract_*.deb

              echo
              echo '========================================'
              echo 'Installed binary'
              echo '========================================'

              command -v innoextract

              file /usr/bin/innoextract

              echo
              echo '========================================'
              echo 'Runtime dependencies'
              echo '========================================'

              ldd /usr/bin/innoextract

              echo
              echo '========================================'
              echo 'Check missing libraries'
              echo '========================================'

              if ldd /usr/bin/innoextract | grep -q 'not found'; then
                echo 'ERROR: Missing runtime libraries'
                ldd /usr/bin/innoextract
                exit 1
              fi

              echo 'All runtime libraries found.'

              echo
              echo '========================================'
              echo 'Check bundled Boost'
              echo '========================================'

              if ! ldd /usr/bin/innoextract | grep -q '/usr/lib/innoextract/libboost_'; then
                echo 'ERROR: Boost is not loaded from the package.'
                ldd /usr/bin/innoextract
                exit 1
              fi

              echo 'Bundled Boost libraries are being used.'

              echo
              echo '========================================'
              echo 'Run innoextract'
              echo '========================================'

              innoextract --help

              echo
              echo '========================================'
              echo 'Debian 10 test successful'
              echo '========================================'
            "

      - name: Test package on Ubuntu latest
        run: |
          set -euo pipefail

          docker run --rm \
            --user root \
            -v "${PWD}/ci-output:/work:ro" \
            ubuntu:latest \
            bash -euxo pipefail -c "

              export DEBIAN_FRONTEND=noninteractive

              echo '========================================'
              echo 'Ubuntu test environment'
              echo '========================================'

              cat /etc/os-release

              apt-get update

              apt-get install -y \
                ca-certificates \
                file

              echo
              echo '========================================'
              echo 'Install innoextract'
              echo '========================================'

              apt-get install -y \
                /work/innoextract_*.deb

              echo
              echo '========================================'
              echo 'Runtime dependencies'
              echo '========================================'

              ldd /usr/bin/innoextract

              echo
              echo '========================================'
              echo 'Check missing libraries'
              echo '========================================'

              if ldd /usr/bin/innoextract | grep -q 'not found'; then
                echo 'ERROR: Missing runtime libraries'
                ldd /usr/bin/innoextract
                exit 1
              fi

              echo 'All runtime libraries found.'

              echo
              echo '========================================'
              echo 'Check bundled Boost'
              echo '========================================'

              if ! ldd /usr/bin/innoextract | grep -q '/usr/lib/innoextract/libboost_'; then
                echo 'ERROR: Boost is not loaded from the package.'
                ldd /usr/bin/innoextract
                exit 1
              fi

              echo 'Bundled Boost libraries are being used.'

              echo
              echo '========================================'
              echo 'Run innoextract'
              echo '========================================'

              innoextract --help

              echo
              echo '========================================'
              echo 'Ubuntu test successful'
              echo '========================================'
            "

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-debian-amd64
          path: ci-output/*.deb
          if-no-files-found: error
